<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>GE Actividades</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --ink:#111827; --muted:#6b7280; --line:#e5e7eb;
    --brand:#3b6ef0; --brand2:#2c56c7; --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
    --chip:#eef0f4; --header:#111827; --navb:#ffffff;
    --shadow:0 1px 2px rgba(17,24,39,.05);
    --bd:1px solid var(--line);
  }
  html[data-theme="dark"]{
    --bg:#0d1017; --card:#151a23; --ink:#e7eaf0; --muted:#8b93a1; --line:#232a36;
    --brand:#6b93f5; --brand2:#89abf8; --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
    --chip:#1c2330; --header:#0a0d13; --navb:#111620;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased}
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font:inherit;color:var(--ink);background:var(--card)}
  .hidden{display:none!important}

  /* ---------- language pick ---------- */
  #lang-pick{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;
    background:var(--header);color:#fff;gap:18px}
  .lp-logo{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .lp-logo .mark{width:46px;height:46px;border-radius:12px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:21px;letter-spacing:-.02em}
  .lp-logo h1{font-size:24px;letter-spacing:-.02em;font-weight:700}
  .lp-sub{color:rgba(255,255,255,.55);font-size:13.5px;margin-bottom:10px}
  .lp-btn{background:var(--card);color:var(--ink);border-radius:12px;padding:16px 46px;font-size:17px;font-weight:600;width:250px;text-align:center;transition:.15s}
  .lp-btn:active{transform:scale(.97)}
  .lp-btn .flag{font-size:22px;display:block;margin-bottom:4px}

  /* ---------- login ---------- */
  #login{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;
    background:var(--header)}
  .login-card{background:var(--card);border:var(--bd);border-radius:16px;box-shadow:var(--shadow);padding:30px 26px;width:100%;max-width:380px}
  .logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px}
  .logo .mark{width:40px;height:40px;border-radius:11px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
  .logo h1{font-size:21px;letter-spacing:-.02em}
  .login-sub{text-align:center;color:var(--muted);margin-bottom:18px;font-size:13.5px}
  .langrow{display:flex;justify-content:center;gap:8px;margin-bottom:18px}
  .langbtn{border:1.5px solid var(--line);border-radius:999px;padding:7px 16px;font-size:13.5px;font-weight:600;color:var(--muted)}
  .langbtn.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
  .field input,.field select,.field textarea{width:100%;border:var(--bd);border-radius:10px;padding:11px 12px;background:var(--card);outline:none;transition:border-color .15s}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:11px 18px;font-weight:600;transition:.15s}
  .btn-primary{background:var(--brand);color:#fff;width:100%}
  .btn-primary:active{background:var(--brand2)}
  .btn-ghost{background:var(--chip);color:var(--ink)}
  .btn-danger{background:transparent;border:var(--bd);color:var(--bad)}
  .btn-sm{padding:7px 12px;font-size:13px;border-radius:8px}
  .err{color:var(--bad);font-size:13.5px;margin-top:10px;text-align:center;min-height:18px}

  /* ---------- shell ---------- */
  #app{min-height:100%}
  header{position:sticky;top:0;z-index:30;background:var(--header);color:#fff;padding:0 14px;border-bottom:1px solid rgba(128,140,160,.15)}
  .hrow{display:flex;align-items:center;justify-content:space-between;height:54px;max-width:720px;margin:0 auto}
  .hrow .title{font-weight:700;font-size:16.5px;letter-spacing:-.01em}
  .bell{position:relative;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
  .bell:active{background:rgba(255,255,255,.12)}
  .bell .dot{position:absolute;top:5px;right:5px;min-width:17px;height:17px;border-radius:9px;background:var(--warn);color:#111;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
  .theme-tog{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px}
  .theme-tog:active{background:rgba(255,255,255,.12)}
  main{max-width:720px;margin:0 auto;padding:14px 14px calc(76px + env(safe-area-inset-bottom))}
  nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--navb);border-top:var(--bd);
    display:flex;justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
  nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:11px;font-weight:600;padding:4px 0;border-radius:10px}
  nav button.on{color:var(--brand)}
  nav .ico{font-size:19px;line-height:1}

  /* ---------- pieces ---------- */
  .card{background:var(--card);border:var(--bd);border-radius:14px;box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
  .row{display:flex;align-items:center;gap:10px}
  .grow{flex:1;min-width:0}
  .muted{color:var(--muted)}
  .small{font-size:12.5px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0;background:var(--card);border:var(--bd);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600;color:var(--muted)}
  .chip.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
  .badge{display:inline-block;border-radius:6px;padding:2px 8px;font-size:11.5px;font-weight:600}
  html[data-theme="light"] .b-pending{background:#fef3c7;color:#92400e}
  html[data-theme="light"] .b-in_progress{background:#dbeafe;color:#1e40af}
  html[data-theme="light"] .b-done{background:#dcfce7;color:#166534}
  html[data-theme="dark"] .b-pending{background:#3a2e10;color:#fcd34d}
  html[data-theme="dark"] .b-in_progress{background:#17284d;color:#93b4f8}
  html[data-theme="dark"] .b-done{background:#0d2b1a;color:#6ee7b7}
  .prio{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .p-baja{background:#94a3b8}.p-normal{background:#3b82f6}.p-alta{background:#f59e0b}.p-urgente{background:#ef4444}
  .overdue{color:var(--bad);font-weight:700}
  .empty{text-align:center;color:var(--muted);padding:40px 10px}
  .empty .big{font-size:40px;margin-bottom:8px}
  .fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:16px;
    background:var(--brand);color:#fff;font-size:26px;box-shadow:0 4px 16px rgba(59,110,240,.35);z-index:25;display:flex;align-items:center;justify-content:center}
  .fab:active{transform:scale(.94)}

  /* ---------- modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(8,10,15,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
  @media(min-width:640px){.overlay{align-items:center}}
  .sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;max-height:92vh;display:flex;flex-direction:column;animation:up .18s ease-out}
  @media(min-width:640px){.sheet{border-radius:18px}}
  @keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px}
  .sheet-head h2{font-size:17px}
  .sheet-body{overflow-y:auto;padding:4px 18px 18px}
  .x{width:34px;height:34px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:16px}

  .upd{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  .upd:first-child{border-top:none}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
  .upd .bubble{flex:1;min-width:0}
  .upd img{max-width:100%;border-radius:10px;margin-top:6px;max-height:300px;object-fit:cover}
  .statusbtns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
  .statusbtns button{border:var(--bd);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;background:var(--card);color:var(--muted)}
  .statusbtns button.on{border-color:var(--ink);background:var(--ink);color:var(--card)}
  .photoPrev{position:relative;display:inline-block;margin-top:8px}
  .photoPrev img{height:110px;border-radius:10px}
  .photoPrev button{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;background:var(--bad);color:#fff;font-size:13px}

  /* calendar */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .cal-head h2{font-size:17px;font-weight:700}
  .cal-nav{width:38px;height:38px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:16px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:6px}
  .cal-dow{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:4px 0;text-transform:uppercase}
  .cal-cell{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;font-weight:600;position:relative;background:var(--chip);color:var(--ink);touch-action:manipulation;user-select:none}
  .cal-cell.other{opacity:.3}
  .cal-cell.today{outline:2px solid var(--brand);outline-offset:-2px}
  .cal-cell.sel{background:var(--brand);color:#fff}
  .cal-cell .dots{position:absolute;bottom:4px;display:flex;gap:2px}
  .cal-cell .dots .d{width:4px;height:4px;border-radius:50%;background:var(--brand)}
  .cal-cell.sel .dots .d{background:#fff}
  .cal-cell .dots .d.done{background:var(--ok)}
  .cal-cell.sel .dots .d.done{background:#bbf7d0}
  .cal-cell .dots .d.ev{background:#7c3aed}
  .cal-cell.sel .dots .d.ev{background:#e9d5ff}
  .openday{width:100%;background:var(--brand);color:#fff;border-radius:12px;padding:13px;font-weight:700;font-size:15px;margin:4px 0 16px;box-shadow:0 3px 10px rgba(37,99,235,.35)}
  .openday:active{background:var(--brand2)}

  /* day view */
  .day-back{display:flex;align-items:center;gap:8px;margin-bottom:14px;color:var(--brand);font-weight:600;font-size:14px}
  .day-back:active{opacity:.7}
  .day-date{font-size:20px;font-weight:800;margin-bottom:14px}
  .timeline-item{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start}
  .timeline-item:first-child{border-top:none}
  .timeline-item .ti-time{font-size:11px;font-weight:700;color:var(--muted);min-width:42px;padding-top:2px}
  .timeline-item .ti-body{flex:1;min-width:0}
  .timeline-item .ti-icon{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;background:var(--chip)}
  .tl-task{border-left:3px solid var(--brand);padding-left:12px}
  .tl-ev{border-left:3px solid #7c3aed;padding-left:12px}

  /* collapsible responses in day view */
  .resp-toggle{cursor:pointer}
  .resp-wrap{overflow:hidden;transition:max-height .25s ease;max-height:0}
  .resp-wrap.open{max-height:1200px;overflow-y:auto}
  .chev{font-size:11px;color:var(--muted);transition:transform .2s}
  .resp-toggle.open .chev{transform:rotate(90deg)}

  /* checklist */
  .ckrow{display:flex;align-items:flex-start;gap:10px;padding:8px 0}
  .ckrow .ckbox{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);background:var(--card);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;font-weight:800}
  .ckrow.done .ckbox{background:var(--ok);border-color:var(--ok)}
  .ckrow.done .cktext{text-decoration:line-through;color:var(--muted)}
  .ckrow .cktext{flex:1;padding-top:1px}
  .ckrow .ckmeta{font-size:11px;color:var(--muted)}
  .ckbar{height:5px;border-radius:3px;background:var(--chip);overflow:hidden;margin:8px 0 4px}
  .ckbar div{height:100%;background:var(--ok);transition:width .25s}

  /* camera */
  #cam-view{position:fixed;inset:0;background:#000;z-index:80;display:flex;flex-direction:column}
  #cam-view video{flex:1;object-fit:contain;width:100%}
  .cam-bar{display:flex;justify-content:space-around;align-items:center;padding:16px 0 calc(16px + env(safe-area-inset-bottom));background:#000}
  .cam-btn{width:64px;height:64px;border-radius:50%;background:#fff;border:4px solid rgba(255,255,255,.4)}
  .cam-btn:active{transform:scale(.92)}
  .cam-x{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;font-size:18px;z-index:2}
  .cam-ts{position:absolute;bottom:110px;left:0;right:0;text-align:center;color:#fff;font-weight:700;font-size:15px;text-shadow:0 1px 4px rgba(0,0,0,.9);pointer-events:none}
  .shotPrev{position:relative;display:inline-block;margin:6px 6px 0 0}
  .shotPrev img{width:74px;height:74px;object-fit:cover;border-radius:10px}
  .shotPrev button{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;background:var(--bad);color:#fff;font-size:12px}
  .multiPrev{display:flex;flex-wrap:wrap}
  .ev-badge{display:inline-flex;align-items:center;gap:5px;background:#f3e8ff;color:#6b21a8;border-radius:6px;padding:2px 8px;font-size:11.5px;font-weight:700}
  html[data-theme="dark"] .ev-badge{background:#2a1d42;color:#c4b5fd}
  .multiPrev img{cursor:zoom-in}
  #lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center}
  #lightbox img{max-width:100%;max-height:78vh;object-fit:contain;border-radius:8px}
  .lb-bar{display:flex;gap:12px;margin-top:16px}
  .lb-bar a,.lb-bar button{background:rgba(255,255,255,.14);color:#fff;border-radius:10px;padding:11px 18px;font-weight:700;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:7px}
  .lb-x{position:absolute;top:14px;right:14px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;font-size:18px}
  .lb-ts{color:#fff;font-size:13px;margin-top:10px;opacity:.85}

  /* team */
  .userrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
  .userrow:first-child{border-top:none}
  .switch{position:relative;width:44px;height:26px;border-radius:13px;background:#cbd5e1;transition:.15s;flex-shrink:0}
  .switch.on{background:var(--ok)}
  .switch::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
  .switch.on::after{left:21px}

  .notif{display:flex;gap:10px;padding:11px 0;border-top:1px solid var(--line);align-items:flex-start}
  .notif:first-child{border-top:none}
  .notif .ni{font-size:18px}
  .notif.unread{background:var(--chip);margin:0 -18px;padding:11px 18px;border-top-color:var(--line)}
  html[data-theme="light"] .notif.unread{background:#eff6ff;border-top-color:#bfdbfe}

  .sect{font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:16px 2px 8px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:var(--ink);color:var(--card);
    padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:60;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
  .toast.show{opacity:1}
  textarea{resize:vertical;min-height:70px}
  .del-x{color:var(--bad);font-weight:700;font-size:16px;width:30px;height:30px;border-radius:8px}
  .del-x:active{background:#fee2e2}
  .meta-line{font-size:12px;color:var(--muted);margin-top:4px}
</style>
</head>
<body>

<!-- ============ LANGUAGE PICK ============ -->
<div id="lang-pick">
  <div class="lp-logo"><div class="mark">GE</div><h1>GE Actividades</h1></div>
  <div class="lp-sub">Tareas, avances y horarios / Tasks, updates & schedules</div>
  <button class="lp-btn" id="lp-es"><span class="flag">🇪🇸</span>Español</button>
  <button class="lp-btn" id="lp-en"><span class="flag">🇬🇧</span>English</button>
</div>

<!-- ============ LOGIN ============ -->
<div id="login" class="hidden">
  <div class="login-card">
    <div class="logo"><div class="mark">GE</div><h1>GE Actividades</h1></div>
    <div class="login-sub" id="lg-sub"></div>
    <div class="langrow">
      <button class="langbtn" id="lang-es">Español</button>
      <button class="langbtn" id="lang-en">English</button>
    </div>
    <div class="field"><label id="lg-user-label"></label><input id="li-user" autocapitalize="none" autocorrect="off" autocomplete="username"></div>
    <div class="field"><label id="lg-pass-label"></label><input id="li-pass" type="password" autocomplete="current-password"></div>
    <button class="btn btn-primary" id="li-btn"></button>
    <div class="err" id="li-err"></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <header><div class="hrow">
    <div class="title" id="h-title"></div>
    <div class="row" style="gap:2px">
      <button class="theme-tog" id="theme-tog" title="Tema / Theme">🌙</button>
      <button class="bell" id="bell">🔔<span class="dot hidden" id="bell-dot">0</span></button>
    </div>
  </div></header>
  <main id="main"></main>
  <button class="fab hidden" id="fab">+</button>
  <nav id="nav"></nav>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="file-in" accept="image/*" class="hidden">

<script>
'use strict';
const $ = s => document.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token = localStorage.getItem('ge_token') || '';
let LANG = localStorage.getItem('ge_lang') || '';
let ME = null;
let TASKS = [], USERS = [], SCHEDULE = [], LOG = [], MILES = [];
let tab = 'calendar';
let taskFilter = 'open';
let evSource = null;
let calMonth = new Date(); calMonth.setDate(1);
let calSelected = new Date().toISOString().slice(0,10);
let dayOpen = false;      // full-screen day view open
let dayExpanded = {};     // itemId -> responses expanded
let onlyMine = localStorage.getItem('ge_onlymine') === '1';
let dayHistOpen = false;  // day history toggle

/* ---------- theme: light / dark, follows phone setting until user chooses ---------- */
function applyTheme(mode) {
  const dark = mode === 'dark' || (mode !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', dark ? '#0a0d13' : '#111827');
  const tog = document.querySelector('#theme-tog');
  if (tog) tog.textContent = dark ? '☀️' : '🌙';
  return dark;
}
function savedTheme() { return localStorage.getItem('ge_theme') || 'auto'; }
applyTheme(savedTheme());
if (window.matchMedia) {
  try {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (savedTheme() === 'auto') applyTheme('auto');
    });
  } catch(e) {}
}
$('#theme-tog').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  localStorage.setItem('ge_theme', next);
  applyTheme(next);
};

const STR = {
  es: {
    subtitle:'Tareas, avances y horarios de tu equipo',

function t(k){ return (STR[LANG] && STR[LANG][k]) || k; }
const ST_KEY = {pending:'st_pending', in_progress:'st_in_progress', done:'st_done'};
const PR_KEY = {baja:'pr_baja', normal:'pr_normal', alta:'pr_alta', urgente:'pr_urgente'};
const ROLE_KEY = {admin:'role_admin', subadmin:'role_subadmin', employee:'role_employee'};
function stEs(s){ return t(ST_KEY[s]||s); }
function prEs(p){ return t(PR_KEY[p]||p); }
function roleEs(r){ return t(ROLE_KEY[r]||r); }
const isManager = () => ME && (ME.role === 'admin' || ME.role === 'subadmin');

function applyLang() {
  document.documentElement.lang = LANG;
  $('#lang-es').classList.toggle('on', LANG === 'es');
  $('#lang-en').classList.toggle('on', LANG === 'en');
  $('#lg-sub').textContent = t('subtitle');
  $('#lg-user-label').textContent = t('user');
  $('#lg-pass-label').textContent = t('password');
  $('#li-btn').textContent = t('enter');
  localStorage.setItem('ge_lang', LANG);
  if (ME) { buildNav(); render(); }
}
$('#lp-es').onclick = () => { LANG='es'; showLogin(); };
$('#lp-en').onclick = () => { LANG='en'; showLogin(); };
$('#lang-es').onclick = () => { LANG='es'; applyLang(); };
$('#lang-en').onclick = () => { LANG='en'; applyLang(); };

function showLogin() {
  $('#lang-pick').classList.add('hidden');
  $('#login').classList.remove('hidden');
  applyLang();
}

function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if (token) opts.headers['Authorization'] = 'Bearer ' + token;
  return fetch(path, opts).then(async r => {
    let j = {}; try { j = await r.json(); } catch(e) {}
    if (!r.ok) { const e = new Error(j.error || t('errGeneric')); e.status = r.status; throw e; }
    return j;
  });
}
function toast(msg) {
  const tt = $('#toast'); tt.textContent = msg; tt.classList.add('show');
  clearTimeout(tt._h); tt._h = setTimeout(()=>tt.classList.remove('show'), 2400);
}
function fmtDate(d) {
  if (!d) return '';
  return new Date(d + 'T12:00:00').toLocaleDateString(LANG, {weekday:'long', day:'numeric', month:'long'});
}
function fmtDateShort(d) {
  if (!d) return '';
  return new Date(d + 'T12:00:00').toLocaleDateString(LANG, {weekday:'short', day:'numeric', month:'short'});
}
function fmtTime(ts) { return new Date(ts).toLocaleTimeString(LANG, {hour:'2-digit', minute:'2-digit'}); }
function fmtTs(ts) {
  const dt = new Date(ts), now = new Date();
  const same = dt.toDateString() === now.toDateString();
  return same ? fmtTime(ts) : dt.toLocaleDateString(LANG,{day:'numeric',month:'short'}) + ' ' + fmtTime(ts);
}
function initials(name){ return (name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function isOverdue(t2){ return t2.due && t2.status !== 'done' && t2.due < new Date().toISOString().slice(0,10); }
function pad2(n){ return String(n).padStart(2,'0'); }

/* ---------------- auth ---------------- */
$('#li-btn').onclick = doLogin;
$('#li-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
async function doLogin() {
  $('#li-err').textContent = '';
  try {
    const r = await api('/api/login', {method:'POST', body:JSON.stringify({
      username:$('#li-user').value.trim(), password:$('#li-pass').value})});
    token = r.token; ME = r.user;
    localStorage.setItem('ge_token', token);
    enterApp();
  } catch(e) {
    $('#li-err').textContent = e.status === 401 ? t('badLogin') : e.status === 429 ? t('rateLimited') : e.message;
  }
}
async function logout() {
  try { await api('/api/logout', {method:'POST'}); } catch(e) {}
  localStorage.removeItem('ge_token'); token = ''; ME = null;
  if (evSource) { evSource.close(); evSource = null; }
  location.reload();
}

/* ---------------- boot ---------------- */
async function boot() {
  if (!LANG) { return; } // show language pick
  showLogin();
  if (!token) return;
  try {
    const me = await api('/api/me');
    ME = me.user; enterApp();
  } catch(e) { localStorage.removeItem('ge_token'); token=''; }
}
function enterApp() {
  $('#login').classList.add('hidden');
  $('#lang-pick').classList.add('hidden');
  $('#app').classList.remove('hidden');
  buildNav(); connectEvents(); refreshAll();
  scheduleDayAlerts();
}

/* ---- task alerts: on login + at 8:00 AM on the day of each task ---- */
let alertTimer = null;
function scheduleDayAlerts() {
  if (alertTimer) clearInterval(alertTimer);
  alertTimer = setInterval(checkDayAlerts, 60000);
  setTimeout(checkDayAlerts, 1500); // shortly after login / app open
}
function checkDayAlerts() {
  if (!ME || !TASKS.length) return;
  const today = new Date().toISOString().slice(0,10);
  const key = 'ge_alerted_' + today;
  // on-login alert: my tasks for today, once per day per device
  if (!localStorage.getItem(key)) {
    const mine = TASKS.filter(x => x.assignee === ME.id && x.status !== 'done' && (
      (Array.isArray(x.dates) && x.dates.includes(today)) || (!Array.isArray(x.dates) && x.due === today)
    ));
    if (mine.length) {
      localStorage.setItem(key, '1');
      toast('🔔 ' + t('alertToday') + ' (' + mine.length + '): ' + mine.map(x => x.title).join(', '));
    } else {
      localStorage.setItem(key, 'none'); // don't re-check every minute
    }
  }
  // 8 AM alert while app is open
  const now = new Date();
  const eightKey = 'ge_alert8_' + today;
  if (now.getHours() >= 8 && !localStorage.getItem(eightKey)) {
    const mine = TASKS.filter(x => x.assignee === ME.id && x.status !== 'done' && (
      (Array.isArray(x.dates) && x.dates.includes(today)) || (!Array.isArray(x.dates) && x.due === today)
    ));
    if (mine.length) {
      localStorage.setItem(eightKey, '1');
      toast('🔔 ' + t('alertToday') + ' (' + mine.length + '): ' + mine.map(x => x.title).join(', '));
    } else {
      localStorage.setItem(eightKey, 'none');
    }
  }
}
function connectEvents() {
  if (evSource) evSource.close();
  evSource = new EventSource('/api/events');
  evSource.onmessage = () => refreshAll(true);
}

/* ---------------- data refresh ---------------- */
async function refreshAll() {
  if (!ME) return;
  try {
    const jobs = [api('/api/tasks'), api('/api/notifications'), api('/api/log'), api('/api/schedule'), api('/api/milestones')];
    if (isManager()) jobs.push(api('/api/users'));
    const [t1, n, lg, sc, mi, u] = await Promise.all(jobs);
    TASKS = t1.tasks; LOG = lg.log; SCHEDULE = sc.schedule; MILES = mi.milestones;
    if (u) USERS = u.users;
    renderBell(n.unread); render();
  } catch(e) { if (e.status === 401) logout(); }
}
function renderBell(n) {
  const d = $('#bell-dot');
  if (n > 0) { d.textContent = n > 99 ? '99+' : n; d.classList.remove('hidden'); }
  else d.classList.add('hidden');
}

/* ---------------- navigation ---------------- */
const TABS = [
  {id:'calendar', ico:'📅', key:'tab_cal'},
  {id:'tasks', ico:'✅', key:'tab_tasks'},
  {id:'team', ico:'👥', key:'tab_team', manager:true},

function buildNav() {
  const nav = $('#nav'); nav.innerHTML = '';
  TABS.filter(x => !x.manager || isManager()).forEach(x => {
    const b = el('button', x.id === tab ? 'on' : '', '<div class="ico">' + x.ico + '</div><div>' + t(x.key) + '</div>');
    b.onclick = () => { tab = x.id; buildNav(); render(); };

  });

  const showFab = isManager() && (tab === 'tasks' || tab === 'calendar');

/* ---------------- render root ---------------- */
function render() {
  const m = $('#main'); m.innerHTML = '';
  if (tab === 'calendar' && dayOpen) renderDayView(m);
  else if (tab === 'calendar') renderCalendar(m);
  else if (tab === 'tasks') renderTasks(m);
  else if (tab === 'team') renderTeam(m);
  else if (tab === 'me') renderMe(m);
}

/* ================= CALENDAR ================= */
function renderCalendar(m) {
  // Build month grid
  const y = calMonth.getFullYear(), mo = calMonth.getMonth();
  const monthName = calMonth.toLocaleDateString(LANG, {month:'long', year:'numeric'});
  const firstDay = new Date(y, mo, 1);
  const startDow = firstDay.getDay(); // 0=Sun
  const daysInMonth = new Date(y, mo+1, 0).getDate();
  const prevMonthDays = new Date(y, mo, 0).getDate();

  // "Only mine" toggle (default on for employees)
  const tog = el('button','btn btn-ghost btn-sm mine-tog', (onlyMine ? '👤 ' + t('onlyMine') : '👥 ' + t('allTasks')));
  if (onlyMine) tog.style.cssText = 'background:var(--brand);color:#fff;border-color:var(--brand)';
  tog.onclick = () => { onlyMine = !onlyMine; localStorage.setItem('ge_onlymine', onlyMine ? '1' : '0'); render(); };
  m.appendChild(tog);

  const head = el('div','cal-head');
  head.innerHTML = '<button class="cal-nav" id="cal-prev">‹</button><h2>' + esc(monthName) + '</h2><button class="cal-nav" id="cal-next">›</button>';
  m.appendChild(head);
  head.querySelector('#cal-prev').onclick = () => { calMonth.setMonth(mo-1); render(); };
  head.querySelector('#cal-next').onclick = () => { calMonth.setMonth(mo+1); render(); };

  // DOW labels
  const grid = el('div','cal-grid');
  const dows = LANG === 'es' ? ['D','L','M','X','J','V','S'] : ['S','M','T','W','T','F','S'];
  dows.forEach(d => grid.appendChild(el('div','cal-dow', d)));
  m.appendChild(grid);

  const grid2 = el('div','cal-grid');
  const todayStr = new Date().toISOString().slice(0,10);

  // Build a map of date -> {task|done, ev} — clean grid: max 2 dots per day
  const dayMap = {};
  TASKS.forEach(t2 => {
    const days = (Array.isArray(t2.dates) && t2.dates.length) ? t2.dates : (t2.due ? [t2.due] : []);
    days.forEach(d => { dayMap[d] = dayMap[d] || {}; if (t2.status === 'done') dayMap[d].done = true; else dayMap[d].task = true; });
  });
  MILES.forEach(mi => { dayMap[mi.date] = dayMap[mi.date] || {}; dayMap[mi.date].ev = true; });

  // prev month padding
  for (let i = startDow - 1; i >= 0; i--) {
    grid2.appendChild(el('div','cal-cell other', String(prevMonthDays - i)));
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const dStr = y + '-' + pad2(mo+1) + '-' + pad2(d);
    const info = dayMap[dStr] || {};
    const cls = 'cal-cell' + (dStr === todayStr ? ' today' : '') + (dStr === calSelected ? ' sel' : '');
    const cell = el('div', cls, String(d));
    if (info.task || info.done || info.ev) {
      const dots = el('div','dots');
      if (info.task) dots.appendChild(el('div','d'));
      if (info.ev) dots.appendChild(el('div','d ev'));
      cell.appendChild(dots);
    }
    // SINGLE TAP: select + show quick list at bottom of homepage
    cell.onclick = () => { calSelected = dStr; render(); };
    grid2.appendChild(cell);
  }
  // next month padding
  const totalCells = startDow + daysInMonth;
  const remain = (7 - (totalCells % 7)) % 7;
  for (let d = 1; d <= remain; d++) grid2.appendChild(el('div','cal-cell other', String(d)));
  m.appendChild(grid2);

  // Open-day button under the grid
  const ob = el('button','openday', '📆 ' + t('openDay') + ' — ' + fmtDateShort(calSelected));
  ob.onclick = () => { dayOpen = true; render(); };
  m.appendChild(ob);

  // Selected day: quick list at the bottom of the homepage
  renderDaySummary(m);
}

/* helpers: a task covers a date if it's in its dates list (or legacy due) */
function taskOnDate(x, ds) {
  if (Array.isArray(x.dates) && x.dates.length) return x.dates.includes(ds);
  return x.due === ds;
}
function visibleTasks() {
  const list = onlyMine ? TASKS.filter(x => x.assignee === ME.id || x.createdBy === ME.id) : TASKS;
  return list;
}

/* Quick list of the selected day at the bottom of the homepage (single tap) */
function renderDaySummary(m) {
  const ds = calSelected;
  const dayTasks = visibleTasks().filter(t2 => taskOnDate(t2, ds));
  const dayEvs = MILES.filter(mi => mi.date === ds);
  if (!dayTasks.length && !dayEvs.length) {
    m.appendChild(el('div','small muted', fmtDate(ds) + ' · ' + t('noTasks')));
  } else {
  m.appendChild(el('div','sect', fmtDate(ds)));
  dayEvs.forEach(mi => {
    const c = el('div','card tl-ev');
    c.innerHTML = '<div class="row"><span>🎉</span><div class="grow"><div style="font-weight:700">' + esc(mi.title) + '</div>' +

/* Task card in the day view — clean; responses hidden until tapped */
function dayTaskCard(t2) {
  const c = el('div','card tl-task');
  const mine = t2.assignee === ME.id;
  const ck = t2.checklist || [];
  const ckDone = ck.filter(x => x.done).length;
  let html = '<div class="row" style="align-items:flex-start">' +
    '<div class="prio p-' + esc(t2.priority) + '" style="margin-top:7px"></div>' +
    '<div class="grow">' +
      '<div style="font-weight:700">' + esc(t2.title) + '</div>' +
      '<div class="meta-line">' + t('assignedTo2') + ' <b>' + esc(t2.assigneeName) + '</b>' + (mine ? ' ' + t('you') : '') + '</div>' +
      '<div class="meta-line">' + t('createdFrom') + ' ' + esc(t2.createdByName) + ' · ' + fmtTs(t2.createdAt) + '</div>';
  if (t2.status === 'done') {
    html += '<div class="meta-line" style="color:var(--ok)">' + t('completedAt') + ' ' + fmtTs(t2.completedAt) + ' ' + t('completedBy') + ' ' + esc(t2.completedByName||'—') + '</div>';
  }
  if (ck.length) {
    html += '<div class="ckbar"><div style="width:' + Math.round(ckDone/ck.length*100) + '%"></div></div>' +
      '<div class="meta-line">' + ckDone + '/' + ck.length + ' ' + t('ckProgress') + '</div>';
  }
  html += '</div><span class="badge b-' + esc(t2.status) + '">' + stEs(t2.status) + '</span></div>';
  c.innerHTML = html;

  // checklist rows (always visible for assignee/manager — the working surface)
  if (ck.length && (isManager() || mine)) {
    ck.forEach(item => c.appendChild(ckRow(t2, item)));
  }

  // collapsible responses
  const key = t2.id;
  const tog = el('div','resp-toggle');
  const isOpen = !!dayExpanded[key];
  tog.innerHTML = '<div class="row small muted" style="padding:8px 0 0"><span class="chev">▶</span> ' +
    (isOpen ? t('hide') : t('tapToSee') + ' (' + (t2.updateCount||0) + ')') + '</div>';
  const wrap = el('div','resp-wrap' + (isOpen ? ' open' : ''));
  if (isOpen) fillResponses(wrap, t2.id);
  tog.onclick = () => {
    dayExpanded[key] = !dayExpanded[key];
    if (dayExpanded[key]) { wrap.classList.add('open'); fillResponses(wrap, t2.id); tog.classList.add('open'); }
    else { wrap.classList.remove('open'); wrap.innerHTML = ''; tog.classList.remove('open'); }
    const lbl = tog.querySelector('.row');
    lbl.innerHTML = '<span class="chev">▶</span> ' + (dayExpanded[key] ? t('hide') : t('tapToSee') + ' (' + (t2.updateCount||0) + ')');
  };
  tog.classList.toggle('open', isOpen);
  c.appendChild(tog); c.appendChild(wrap);
  // open full task detail on title tap
  c.querySelector('.row').onclick = () => openTask(t2.id);
  return c;
}

async function fillResponses(wrap, taskId) {
  wrap.innerHTML = '<div class="small muted" style="padding:6px 0">…</div>';
  try {
    const d = await api('/api/tasks/' + taskId);
    wrap.innerHTML = '';
    if (!d.updates.length) wrap.appendChild(el('div','small muted', '—'));
    d.updates.forEach(u2 => {
      const r = el('div','upd');
      r.innerHTML = '<div class="avatar">' + esc(initials(u2.authorName)) + '</div>' +
        '<div class="bubble"><div class="small"><b>' + esc(u2.authorName) + '</b> <span class="muted">· ' + fmtTs(u2.ts) + '</span></div>' +
        (u2.text ? '<div style="white-space:pre-wrap;margin-top:2px">' + esc(u2.text) + '</div>' : '') +
        ((u2.photos||[]).length ? '<div class="multiPrev">' + u2.photos.map(p => '<img loading="lazy" src="' + esc(p) + '">').join('') + '</div>' : '') +
        '</div>';
      wrap.appendChild(r);
    });
  } catch(e) { wrap.innerHTML = ''; wrap.appendChild(el('div','small muted', e.message)); }
}

/* checklist row with live toggle — checkmark appears instantly, server confirms after */
function ckRow(t2, item) {
  const r = el('div','ckrow' + (item.done ? ' done' : ''));
  const canCheck = isManager() || t2.assignee === ME.id;
  r.innerHTML = '<div class="ckbox">' + (item.done ? '✓' : '') + '</div>' +
    '<div class="grow"><div class="cktext">' + esc(item.text) + '</div>' +
    (item.done && item.doneAt ? '<div class="ckmeta">' + t('doneBy') + ' ' + esc(item.doneByName || '') + ' · ' + fmtTs(item.doneAt) + '</div>' : '') + '</div>' +
    '<button class="btn btn-ghost btn-sm ck-thread">💬</button>';
  if (canCheck) {
    r.querySelector('.ckbox').parentElement.style.cursor = 'pointer';
    r.onclick = async e => {
      if (e.target.closest('.ck-thread')) return;
      const box = r.querySelector('.ckbox');
      const willBeDone = !item.done;
      // live checkmark immediately
      box.textContent = willBeDone ? '✓' : '';
      r.classList.toggle('done', willBeDone);
      const localTask = TASKS.find(x => x.id === t2.id);
      if (localTask) { const li = localTask.checklist.find(c => c.id === item.id); if (li) { li.done = willBeDone; li.doneBy = willBeDone ? ME.id : null; li.doneAt = willBeDone ? new Date().toISOString() : null; li.doneByName = willBeDone ? ME.name : null; } }
      try {
        const resp = await api('/api/tasks/' + t2.id + '/check', {method:'POST', body:JSON.stringify({itemId:item.id})});
        const idx = TASKS.findIndex(x => x.id === t2.id);
        if (idx > -1) TASKS[idx] = resp.task;
        const ck2 = resp.task.checklist || [];
        if (resp.task.status === 'done' && ck2.length && ck2.every(x => x.done)) toast(t('taskAutoDone'));
        render();
      } catch(e2) {
        // rollback on failure
        box.textContent = item.done ? '✓' : '';
        r.classList.toggle('done', !!item.done);
        toast(e2.message);
      }
    };
  }
  r.querySelector('.ck-thread').onclick = e => { e.stopPropagation(); openCheckThread(t2, item); };
  return r;
}

/* per-checkbox conversation thread */
async function openCheckThread(t2, item) {
  const ov = el('div','overlay'); const sheet = el('div','sheet');
  sheet.innerHTML = '<div class="sheet-head"><h2>💬 ' + t('thread') + '</h2><button class="x">✕</button></div>' +
    '<div class="sheet-body"><div class="card" style="background:var(--chip)"><b>' + esc(item.text) + '</b>' +
    '<div class="meta-line">' + (item.done ? '☑️ ' + t('doneBy') + ' ' + esc(item.doneByName||'') + ' · ' + fmtTs(item.doneAt) : t('checkItem')) + '</div></div>' +
    '<div id="ct-list"><div class="small muted">…</div></div></div>';
  sheet.querySelector('.x').onclick = () => ov.remove();
  ov.appendChild(sheet); document.body.appendChild(ov);
  const listEl = sheet.querySelector('#ct-list');
  const canPost = isManager() || t2.assignee === ME.id;

  async function loadThread() {
    try {
      const d = await api('/api/tasks/' + t2.id);
      const all = d.updates.filter(u2 => u2.checkId === item.id);
      const roots = all.filter(u2 => !u2.replyTo);
      listEl.innerHTML = '';
      if (!roots.length) listEl.appendChild(el('div','small muted','—'));
      const renderOne = (u2, depth) => {
        const r = el('div','upd'); if (depth) r.style.marginLeft = (depth * 22) + 'px';
        const rx = Object.entries(u2.reactions || {}).map(([em, ids]) => em + (ids.length > 1 ? ids.length : '')).join(' ');
        r.innerHTML = '<div class="avatar">' + esc(initials(u2.authorName)) + '</div>' +
          '<div class="bubble"><div class="small"><b>' + esc(u2.authorName) + '</b> <span class="muted">· ' + fmtTs(u2.ts) + '</span></div>' +
          (u2.text ? '<div style="white-space:pre-wrap;margin-top:2px">' + esc(u2.text) + '</div>' : '') +
          ((u2.photos||[]).length ? '<div class="multiPrev">' + u2.photos.map(p => '<img loading="lazy" src="' + esc(p) + '">').join('') + '</div>' : '') +
          ((u2.videos||[]).length ? u2.videos.map(v => '<video src="' + esc(v) + '" controls preload="metadata" style="width:100%;max-height:280px;border-radius:10px;margin-top:6px"></video>').join('') : '') +
          (rx ? '<div class="small" style="margin-top:4px">' + esc(rx) + '</div>' : '') +
          '<div class="row small" style="gap:10px;margin-top:4px">' +
            (canPost ? '<span class="lnk ct-reply">↩︎ ' + t('replyTo') + '</span>' : '') +
            '<span class="lnk ct-react">👍</span><span class="lnk ct-react">🔥</span><span class="lnk ct-react">✅</span>' +
          '</div></div>';
        if (canPost) r.querySelector('.ct-reply').onclick = () => openComposer(u2.id);
        r.querySelectorAll('.ct-react').forEach(btn => btn.onclick = async () => {
          try { await api('/api/updates/' + u2.id + '/react', {method:'POST', body:JSON.stringify({emoji: btn.textContent})}); loadThread(); } catch(e3) { toast(e3.message); }
        });
        return r;
      };
      roots.forEach(root => {
        listEl.appendChild(renderOne(root, 0));
        all.filter(u2 => u2.replyTo === root.id).forEach(child => listEl.appendChild(renderOne(child, 1)));
      });
    } catch(e) { listEl.innerHTML = ''; listEl.appendChild(el('div','small muted', e.message)); }
  }

  function openComposer(replyTo) {
    const old = sheet.querySelector('.ct-compose'); if (old) old.remove();
    const comp = el('div','ct-compose');
    comp.style.cssText = 'border-top:1px solid var(--line);padding-top:10px;margin-top:8px';
    const ta = el('textarea'); ta.placeholder = t('replyTo') + '…'; ta.style.width = '100%'; ta.rows = 2;
    let vids = [], phots = [];
    const prev = el('div','multiPrev');
    const camB = el('button','btn btn-ghost btn-sm', t('camera'));
    const galB = el('button','btn btn-ghost btn-sm', t('gallery'));
    const vidB = el('button','btn btn-ghost btn-sm', t('video'));
    const sendB = el('button','btn btn-primary btn-sm', t('send'));
    camB.onclick = () => openCamera(async du => {
      if (phots.length >= 20) { toast('20 max'); return; }
      try { const r = await api('/api/upload', {method:'POST', body:JSON.stringify({dataUrl:du})}); phots.push(r.url); drawPrev(); } catch(e3) { toast(e3.message); }
    });
    galB.onclick = () => pickPhotos(urls => { urls.forEach(u2 => { if (phots.length < 20) phots.push(u2); }); drawPrev(); }, 'image/*');
    vidB.onclick = () => pickPhotos(async urls => {
      for (const u2 of urls.slice(0, 3)) {
        try { const r = await api('/api/upload', {method:'POST', body:JSON.stringify({dataUrl:u2})}); vids.push(r.url); drawPrev(); }
        catch(e3) { toast(e3.message); }
      }
    }, 'video/*');
    function drawPrev() {
      prev.innerHTML = '';
      phots.forEach((p, i) => { const s = el('div','shotPrev','<img src="' + esc(p) + '">'); const xx = el('button','x','✕'); xx.onclick = () => { phots.splice(i,1); drawPrev(); }; s.appendChild(xx); prev.appendChild(s); });
      vids.forEach((v, i) => { const s = el('div','shotPrev','<video src="' + esc(v) + '" style="width:74px;height:74px;object-fit:cover;border-radius:10px"></video>'); const xx = el('button','x','✕'); xx.onclick = () => { vids.splice(i,1); drawPrev(); }; s.appendChild(xx); prev.appendChild(s); });
    }
    const row = el('div','row'); row.append(camB, galB, vidB, sendB);
    comp.append(ta, prev, row);
    sheet.querySelector('.sheet-body').appendChild(comp);
    sendB.onclick = async () => {
      const text = ta.value.trim();
      if (!text && !phots.length && !vids.length) { toast(t('writeSomething')); return; }
      sendB.disabled = true;
      try {
        await api('/api/tasks/' + t2.id + '/updates', {method:'POST', body:JSON.stringify({text, photos:phots, videos:vids, checkId:item.id, replyTo: replyTo || null})});
        comp.remove(); loadThread(); refreshAll();
      } catch(e3) { toast(e3.message); sendB.disabled = false; }
    };
  }
  loadThread();
  if (canPost) openComposer(null);
}

function logItem(e) {
  const item = el('div','timeline-item');
  const ICONS = {
    task_created:'📋', task_completed:'✅', task_reopened:'🔄', task_status:'🔄',
    task_deleted:'🗑', task_reassigned:'👤', update_added:'💬', check_done:'☑️',
    user_created:'👋', user_updated:'✏️', user_deleted:'🗑',
    schedule_created:'📅', schedule_deleted:'🗑',
    milestone_created:'🎉', milestone_deleted:'🗑',
  };
  let txt = '';
  if (e.type === 'task_created') txt = t('taskCreated2') + ': "' + esc(e.taskTitle) + '" → ' + esc(e.assigneeName);
  else if (e.type === 'task_completed') txt = t('taskCompleted2') + ': "' + esc(e.taskTitle) + '"';
  else if (e.type === 'check_done') txt = t('checkedAt') + ' "' + esc(e.itemText||'') + '" (' + esc(e.taskTitle||'') + ')';
  else if (e.type === 'task_reopened') txt = t('taskReopened') + ': "' + esc(e.taskTitle) + '"';
  else if (e.type === 'task_status') txt = t('taskReopened') + ': "' + esc(e.taskTitle) + '"';
  else if (e.type === 'task_deleted') txt = t('taskDeleted2') + ': "' + esc(e.taskTitle) + '"';
  else if (e.type === 'task_reassigned') txt = t('taskReassigned2') + ': "' + esc(e.taskTitle) + '" (' + esc(e.fromName) + ' → ' + esc(e.toName) + ')';
  else if (e.type === 'update_added') txt = t('updateAdded') + ': "' + esc(e.taskTitle) + '"' + (e.hasPhoto ? ' 📷' : '');
  else if (e.type === 'user_created') txt = t('userCreated') + ': ' + esc(e.targetName);
  else if (e.type === 'user_updated') txt = t('userUpdated') + ': ' + esc(e.targetName);
  else if (e.type === 'user_deleted') txt = t('userDeleted') + ': ' + esc(e.targetName);
  else if (e.type === 'schedule_created') txt = t('scheduleCreated2') + ': ' + esc(e.scheduleTitle);
  else if (e.type === 'schedule_deleted') txt = t('scheduleDeleted2') + ': ' + esc(e.scheduleTitle);
  else if (e.type === 'milestone_created') txt = t('milestoneCreated2') + ': ' + esc(e.milestoneTitle) + ' (' + fmtDateShort(e.date) + ')';
  else if (e.type === 'milestone_deleted') txt = t('milestoneDeleted2') + ': ' + esc(e.milestoneTitle);
  else txt = esc(e.type);

  item.innerHTML =
    '<div class="ti-time">' + fmtTime(e.ts) + '</div>' +
    '<div class="ti-icon">' + (ICONS[e.type] || '•') + '</div>' +
    '<div class="ti-body"><div>' + txt + '</div>' +
    '<div class="meta-line">' + esc(e.actorName) + '</div></div>';
  return item;
}

/* ================= TASKS ================= */
function renderTasks(m) {
  const filters = [['open','f_open'], ['mine','f_mine'], ['todo','f_all'], ['done','f_done']];
  const chips = el('div','chips');
  filters.forEach(([id,key]) => {
    const c = el('button','chip' + (taskFilter === id ? ' on' : ''), t(key));
    c.onclick = () => { taskFilter = id; render(); };
    chips.appendChild(c);
  });
  m.appendChild(chips);

  let list = TASKS.slice();
  if (taskFilter === 'open') list = list.filter(x => x.status !== 'done');
  else if (taskFilter === 'mine') list = list.filter(x => x.assignee === ME.id && x.status !== 'done');
  else if (taskFilter === 'done') list = list.filter(x => x.status === 'done');

  if (!list.length) {
    m.appendChild(el('div','empty','<div class="big">🍂</div>' + t('emptyTasks') + ' ' +
      (isManager() && taskFilter === 'open' ? t('firstTask') : t('emptyAll'))));
    return;
  }
  list.forEach(x => m.appendChild(taskCard(x)));
}
/* ================= PERSON VIEW: one member, all their tasks ================= */
function openPersonView(userId) {
  const u = USERS.find(x => x.id === userId);
  if (!u) return;
  const ov = el('div','overlay'); const sheet = el('div','sheet');
  sheet.innerHTML = '<div class="sheet-head"><h2>👤 ' + esc(u.name) + '</h2><button class="x">✕</button></div>' +
    '<div class="sheet-body" id="pv-body"></div>';
  sheet.querySelector('.x').onclick = () => ov.remove();
  ov.appendChild(sheet); document.body.appendChild(ov);
  const body = sheet.querySelector('#pv-body');
  const isMgr = ME.role === 'admin' || ME.role === 'subadmin';

  function render2() {
    const mine = TASKS.filter(x => x.assignee === userId);
    const ck = t => (t.checklist || []);
    const pend = mine.filter(x => x.status === 'pending');
    const prog = mine.filter(x => x.status === 'in_progress');
    const done = mine.filter(x => x.status === 'done');
    const late = mine.filter(x => isOverdue(x));

    // mini stats header
    const stats = el('div','card');
    stats.innerHTML = '<div class="row" style="gap:14px;flex-wrap:wrap">' +
      '<div class="small"><b style="font-size:17px">' + pend.length + '</b><div class="muted">' + t('stPending') + '</div></div>' +
      '<div class="small"><b style="font-size:17px">' + prog.length + '</b><div class="muted">' + t('stProgress') + '</div></div>' +
      '<div class="small"><b style="font-size:17px;color:var(--bad)">' + late.length + '</b><div class="muted">' + t('stLate') + '</div></div>' +
      '<div class="small"><b style="font-size:17px;color:var(--ok)">' + done.length + '</b><div class="muted">' + t('stDone') + '</div></div>' +
      '</div>' +
      '<div class="small muted" style="margin-top:8px">@' + esc(u.username) + ' · ' + roleEs(u.role) + '</div>';
    body.innerHTML = ''; body.appendChild(stats);

  const old = $('#lightbox'); if (old) old.remove();
  const lb = el('div'); lb.id = 'lightbox';
  const name = 'GE-' + (when ? when.replace(/[:T]/g,'-').slice(0,19) : Date.now()) + '.jpg';

    '<div class="lb-bar"><a id="lb-dl" download="' + esc(name) + '">⬇️ ' + t('download') + '</a></div>';
  lb.querySelector('.lb-x').onclick = () => lb.remove();
  lb.onclick = e => { if (e.target === lb) lb.remove(); };
  lb.querySelector('#lb-dl').onclick = async e => {
    // ensure the download works even though the img is same-origin served
    e.preventDefault();
    try {
      const r = await fetch(src); const b = await r.blob();
      const url = URL.createObjectURL(b);
      const a = document.createElement('a');
      a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    } catch(err) { window.open(src, '_blank'); }
  };
  document.body.appendChild(lb);
}

/* ---------- photo picking: gallery (multi, up to 20) + live camera ---------- */
let photoMultiCb = null;
let fileAccept = 'image/*';
function pickPhotos(cb, accept) { photoMultiCb = cb; if (accept) { $('#file-in').setAttribute('accept', accept); } else { $('#file-in').setAttribute('accept','image/*'); } $('#file-in').click(); }
$('#file-in').multiple = true;
$('#file-in').onchange = async e => {
  const files = [...e.target.files].slice(0, 20);
  e.target.value = '';
  if (!files.length || !photoMultiCb) return;
  toast(t('photosUploading'));
  try {
    const urls = [];
    for (const f of files) {
      const isVid = (f.type || '').startsWith('video/');
      let dataUrl;
      if (isVid) {
        dataUrl = await fileToDataUrl(f);
        if (f.size > 40 * 1024 * 1024) { toast(t('uploadFail') + 'video > 40MB'); continue; }
        const r = await api('/api/upload', {method:'POST', body:JSON.stringify({dataUrl})});
        urls.push(r.url);
      } else {
        dataUrl = await resizeImage(f, 1600, 0.82);
        const r = await api('/api/upload', {method:'POST', body:JSON.stringify({dataUrl})});
        urls.push(r.url);
      }
    }
    photoMultiCb(urls);
  } catch(err) { toast(t('uploadFail') + err.message); }
};
function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result);
    fr.onerror = reject;
    fr.readAsDataURL(file);
  });
}

/* live camera with burned-in timestamp */
function openCamera(onShot) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { toast(t('camNotAvailable')); return; }
  let stream = null;
  const view = el('div'); view.id = 'cam-view';
  view.innerHTML = '<video autoplay playsinline muted></video>' +
    '<div class="cam-ts" id="cam-ts"></div>' +
    '<button class="cam-x">✕</button>' +
    '<div class="cam-bar"><button class="cam-btn" id="cam-shoot"></button></div>';
  document.body.appendChild(view);
  const video = view.querySelector('video');
  const tsEl = view.querySelector('#cam-ts');
  const tsTimer = setInterval(() => { tsEl.textContent = new Date().toLocaleString(LANG); }, 500);
  tsEl.textContent = new Date().toLocaleString(LANG);
  const close = () => { clearInterval(tsTimer); if (stream) stream.getTracks().forEach(tr => tr.stop()); view.remove(); };
  view.querySelector('.cam-x').onclick = close;
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
    .then(s => { stream = s; video.srcObject = s; })
    .catch(() => { toast(t('camNotAvailable')); close(); });
  view.querySelector('#cam-shoot').onclick = () => {
    if (!stream || !video.videoWidth) return;
    const cv = document.createElement('canvas');
    const w = Math.min(1600, video.videoWidth);
    const h = Math.round(video.videoHeight * (w / video.videoWidth));
    cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d');
    ctx.drawImage(video, 0, 0, w, h);
    // burn timestamp into the image
    const stamp = new Date().toLocaleString(LANG) + ' · GE Actividades';
    ctx.font = Math.round(w * 0.032) + 'px sans-serif';
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    const tw = ctx.measureText(stamp).width;
    ctx.fillRect(10, h - Math.round(w*0.032) - 22, tw + 20, Math.round(w*0.032) + 16);
    ctx.fillStyle = '#fff';
    ctx.fillText(stamp, 20, h - 16);
    onShot(cv.toDataURL('image/jpeg', 0.85));
    close();
  };
}
function resizeImage(file, maxDim, q) {
  return new Promise((resolve, reject) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      let w = img.width, h = img.height;
      const scale = Math.min(1, maxDim / Math.max(w, h));
      w = Math.round(w*scale); h = Math.round(h*scale);
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url); resolve(cv.toDataURL('image/jpeg', q));
    };
    img.onerror = reject; img.src = url;
  });
}

/* ---------- task create/edit (manager) ---------- */
function taskForm(existing, presetAssignee) {
  const isEdit = !!existing;
  const ov = el('div','overlay'); const sheet = el('div','sheet');

      '<div id="ck-editor"></div>' +
      '<div class="small muted" style="margin-top:6px">' + (LANG==='es'
        ? 'Cada línea = una casilla. Enter = nueva casilla. Borrar en línea vacía = quitar casilla.'

      '</select></div>' +
      '<div class="field grow"><label>' + t('priority').replace(':','') + '</label><select id="tf-prio">' +
        ['baja','normal','alta','urgente'].map(p => '<option value="' + p + '"' + (existing && existing.priority === p ? ' selected' : '') + '>' + prEs(p) + '</option>').join('') +
      '</select></div></div>' +
      '<div class="field"><label>' + t('dueDate') + ' *</label><input id="tf-due" type="date" value="' + esc(existing?(existing.due||''):'') + '"></div>' +
      '<div class="field"><label>' + t('multiDates') + '</label>' +
      '<div class="row"><input id="tf-days" type="number" min="1" max="62" value="1" style="width:90px" inputmode="numeric">' +
      '<span class="small muted" style="padding:0 10px">' + (LANG==='es' ? 'días seguidos (1 = solo ese día)' : 'days in a row (1 = just that day)') + '</span></div></div>' +
      '<button class="btn btn-primary" id="tf-save">' + (isEdit ? t('save') : t('createTask')) + '</button>' +
    '</div>';
  sheet.querySelector('.x').onclick = () => ov.remove();
  ov.appendChild(sheet); document.body.appendChild(ov);

  /* --- checklist editor: rows with ☐ + input; Enter adds row, Backspace on empty removes --- */
  const editor = sheet.querySelector('#ck-editor');
  function addRow(val) {
    const row = el('div','row'); row.style.marginBottom = '6px';
    row.innerHTML = '<div class="ckbox" style="margin-top:9px"></div>';
    const inp = el('input'); inp.type = 'text'; inp.className = 'grow';
    inp.style.cssText = 'border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;outline:none';
    inp.value = val || '';
    inp.placeholder = t('checkItem');
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); addRow(''); editor.lastChild.querySelector('input').focus(); }
      else if (e.key === 'Backspace' && inp.value === '') {
        e.preventDefault();
        if (editor.children.length > 1) {
          const prev = row.previousElementSibling;
          row.remove(); if (prev) prev.querySelector('input').focus();
        }
      }
    });
    row.appendChild(inp); editor.appendChild(row);
    return row;
  }
  // ➕ button — phone-friendly way to add checkbox lines (Enter still works on laptops)
  const addBtnRow = el('div');
  const addBtn = el('button','btn btn-ghost btn-sm','➕ ' + t('checklist'));
  addBtn.type = 'button';
  addBtn.onclick = () => { addRow('').querySelector('input').focus(); };
  addBtnRow.appendChild(addBtn); addBtnRow.style.marginTop = '6px';
  editor.parentElement.appendChild(addBtnRow);
  // prefill: from existing checklist, or one empty row
  const prefill = existing && (existing.checklist||[]).length
    ? existing.checklist.map(i => i.text)
    : (existing && existing.desc ? existing.desc.split('\n') : ['']);
  prefill.forEach(v => addRow(v));

  sheet.querySelector('#tf-save').onclick = async () => {
    const lines = [...editor.querySelectorAll('input')].map(i => i.value.trim()).filter(Boolean);
    // build the date list: start date + N days in a row
    const startD = sheet.querySelector('#tf-due').value;
    const nDays = Math.max(1, Math.min(62, parseInt(sheet.querySelector('#tf-days').value, 10) || 1));
    let dates = [];
    if (startD) {
      const d0 = new Date(startD + 'T12:00:00');
      for (let i = 0; i < nDays; i++) {
        const d = new Date(d0); d.setDate(d.getDate() + i);
        dates.push(d.toISOString().slice(0,10));
      }
    }
    const payload = {
      title: sheet.querySelector('#tf-title').value.trim(),
      desc: lines.map(l => '[ ] ' + l).join('\n'),
      assignee: sheet.querySelector('#tf-assignee').value,
      priority: sheet.querySelector('#tf-prio').value,
      due: dates[0] || null,
      dates,
    };
    if (!payload.title) { toast(t('needTitle')); return; }
    if (!payload.due) { toast(t('needDate')); return; }
    try {
      if (isEdit) await api('/api/tasks/' + existing.id, {method:'PATCH', body:JSON.stringify(payload)});
      else await api('/api/tasks', {method:'POST', body:JSON.stringify(payload)});
      ov.remove(); refreshAll(); toast(isEdit ? t('taskUpdated') : t('taskCreated'));
    } catch(e) { toast(e.message); }
  };
  setTimeout(() => sheet.querySelector('#tf-title').focus(), 80);
}

/* ================= TEAM ================= */
function renderTeam(m) {
  const canMgr = ME.role === 'admin' || ME.role === 'subadmin';
  if (canMgr) {
    const add = el('button','btn btn-primary', t('addPerson'));
    add.style.marginBottom = '14px'; add.onclick = () => userForm();
    m.appendChild(add);
  }
  const card = el('div','card');
  USERS.forEach(u => {
    const r = el('div','userrow');
    const canDelete = ME.role === 'admin' && u.id !== ME.id;
    const canOpen = ME.role === 'admin' || ME.role === 'subadmin' || u.id === ME.id;
    r.innerHTML =
      '<div class="avatar" style="background:' + (u.role === 'admin' ? '#7c3aed' : u.role === 'subadmin' ? '#0891b2' : 'var(--brand)') + '">' + esc(initials(u.name)) + '</div>' +
      '<div class="grow"><div style="font-weight:700">' + esc(u.name) + (u.id === ME.id ? ' <span class="muted small">' + t('you') + '</span>' : '') + '</div>' +
      '<div class="small muted">@' + esc(u.username) + ' · ' + roleEs(u.role) + (u.active ? '' : ' · <b style="color:var(--bad)">' + t('inactive') + '</b>') + '</div></div>' +
      (canOpen ? '<div style="color:var(--muted);font-size:20px">›</div>' : '') +
      (u.id !== ME.id && ME.role === 'admin' ? '<div class="switch' + (u.active ? ' on' : '') + '"></div>' : '') +
      (ME.role === 'admin' ? '<button class="btn btn-ghost btn-sm">' + t('edit') + '</button>' : '') +
      (canDelete ? '<button class="del-x">🗑</button>' : '');
    if (canOpen) {
      r.style.cursor = 'pointer';
      r.onclick = e => {
        if (e.target.closest('.switch') || e.target.closest('.btn') || e.target.closest('.del-x')) return;
        openPersonView(u.id);
      };
    }
    const sw = r.querySelector('.switch');
    if (sw) sw.onclick = async () => {
      try { await api('/api/users/' + u.id, {method:'PATCH', body:JSON.stringify({active:!u.active})});
        refreshAll(); toast(u.name + ' ' + (u.active ? t('deactivated') : t('activated'))); }
      catch(e) { toast(e.message); }
    };
    const editBtn = r.querySelector('.btn');
    if (editBtn) editBtn.onclick = () => userForm(u);
    const delBtn = r.querySelector('.del-x');
    if (delBtn) delBtn.onclick = async () => {
      if (!confirm(t('confirmDelUser') + ' ' + u.name + '?')) return;
      try { await api('/api/users/' + u.id, {method:'DELETE'}); refreshAll(); toast(t('userDeletedMsg')); }
      catch(e) { toast(e.message); }
    };
    card.appendChild(r);
  });
  m.appendChild(card);
  m.appendChild(el('div','small muted', t('inactiveNote')));
}
function userForm(existing) {
  const isEdit = !!existing;
  const ov = el('div','overlay'); const sheet = el('div','sheet');
  sheet.innerHTML =
    '<div class="sheet-head"><h2>' + (isEdit ? esc(existing.name) : t('newPerson')) + '</h2><button class="x">✕</button></div>' +
    '<div class="sheet-body">' +
      '<div class="field"><label>' + t('name') + '</label><input id="uf-name" maxlength="60" value="' + esc(existing?existing.name:'') + '"></div>' +
      (isEdit ? '' : '<div class="field"><label>' + t('usernameFor') + '</label><input id="uf-user" autocapitalize="none" placeholder="ej. juan.perez"></div>') +

      '<div class="field"><label>' + t('role') + '</label><select id="uf-role">' +

      '</select></div>' +
      '<button class="btn btn-primary" id="uf-save">' + (isEdit ? t('save') : t('createAccount')) + '</button>' +
    '</div>';
  sheet.querySelector('.x').onclick = () => ov.remove();
  ov.appendChild(sheet); document.body.appendChild(ov);

    try {
      if (isEdit) {
        const payload = {name: sheet.querySelector('#uf-name').value.trim(), role: sheet.querySelector('#uf-role').value};
        const pw = sheet.querySelector('#uf-pass').value; if (pw) payload.password = pw;
        await api('/api/users/' + existing.id, {method:'PATCH', body:JSON.stringify(payload)});
      } else {
        await api('/api/users', {method:'POST', body:JSON.stringify({
          name: sheet.querySelector('#uf-name').value.trim(),
          username: sheet.querySelector('#uf-user').value.trim(),
          password: sheet.querySelector('#uf-pass').value,
          role: sheet.querySelector('#uf-role').value})});
      }
      ov.remove(); refreshAll(); toast(isEdit ? t('saved') : t('accountCreated'));
    } catch(e) { toast(e.message); }
  };
}

/* ================= NOTIFICATIONS ================= */
$('#bell').onclick = async () => {
  let d;
  try { d = await api('/api/notifications'); } catch(e) { return; }
  const ov = el('div','overlay'); const sheet = el('div','sheet');
  sheet.innerHTML = '<div class="sheet-head"><h2>' + t('notifications') + '</h2><button class="x">✕</button></div><div class="sheet-body"></div>';
  const body = sheet.querySelector('.sheet-body');
  if (!d.notifications.length) body.appendChild(el('div','empty','<div class="big">🔔</div>' + t('noNews')));
  const ICONS = {'task.created':'📋','task.status':'🔄','task.reassigned':'👤','update.new':'💬','schedule.new':'📅','user.created':'👋','task.completed':'✅'};
  d.notifications.forEach(n => {
    const p = n.payload || {}; let txt = '';
    if (n.type === 'task.completed') txt = t('taskDone') + ': <b>' + esc(p.title) + '</b> — ' + t('completedBy2') + ' <b>' + esc(p.by) + '</b> · ' + fmtTs(p.at);
    else if (n.type === 'task.created') txt = '<b>' + esc(p.by) + '</b>' + t('n_assigned') + esc(p.title);
    else if (n.type === 'task.status') txt = '<b>' + esc(p.by) + '</b>' + t('n_moved') + esc(p.title) + t('n_to') + '<b>' + esc(p.toEs) + '</b>';
    else if (n.type === 'task.reassigned') txt = '<b>' + esc(p.by) + '</b>' + t('n_moved') + esc(p.title) + t('n_to') + esc(p.to);
    else if (n.type === 'update.new') txt = '<b>' + esc(p.by) + '</b>' + t('n_updateIn') + esc(p.title) + '"' + (p.hasPhoto ? ' 📷' : '');
    else if (n.type === 'schedule.new') txt = '<b>' + esc(p.by) + '</b>' + t('n_scheduled') + esc(p.title) + ' (' + fmtDateShort(p.date) + (p.start ? ' ' + p.start : '') + ')';
    else if (n.type === 'user.created') txt = t('n_newAccount') + esc(p.name) + ' (@' + esc(p.username) + ')';
    const row = el('div','notif' + (n.seq > d.lastSeen ? ' unread' : ''),
      '<div class="ni">' + (ICONS[n.type] || '•') + '</div><div class="grow"><div>' + txt + '</div>' +
      '<div class="meta-line">' + fmtTs(n.ts) + '</div></div>');
    if (p.taskId) row.onclick = () => { ov.remove(); openTask(p.taskId); };
    body.appendChild(row);
  });
  sheet.querySelector('.x').onclick = () => { ov.remove(); refreshAll(); };
  ov.onclick = e => { if (e.target === ov) { ov.remove(); refreshAll(); } };
  ov.appendChild(sheet); document.body.appendChild(ov);
  if (d.notifications.length) {
    const maxSeq = Math.max(...d.notifications.map(n => n.seq));
    api('/api/seen', {method:'POST', body:JSON.stringify({seq:maxSeq})}).catch(()=>{});
  }
};
