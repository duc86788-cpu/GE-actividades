<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>GE Actividades</title>
<style>
  :root{
    --bg:#f1f5f9; --card:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
    --brand:#2563eb; --brand2:#1d4ed8; --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
    --chip:#f1f5f9; --shadow:0 1px 3px rgba(15,23,42,.08),0 4px 16px rgba(15,23,42,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
  button{font:inherit;cursor:pointer;border:none;background:none}
  input,select,textarea{font:inherit;color:var(--ink)}
  .hidden{display:none!important}

  /* ---------- language pick ---------- */
  #lang-pick{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;
    background:linear-gradient(160deg,#0f172a 0%,#1e3a8a 100%);color:#fff;gap:20px}
  .lp-logo{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .lp-logo .mark{width:52px;height:52px;border-radius:14px;background:#fff;color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px}
  .lp-logo h1{font-size:26px;letter-spacing:-.02em}
  .lp-sub{color:rgba(255,255,255,.6);font-size:14px;margin-bottom:8px}
  .lp-btn{background:#fff;color:var(--ink);border-radius:14px;padding:18px 48px;font-size:18px;font-weight:700;width:260px;text-align:center;transition:.15s}
  .lp-btn:active{transform:scale(.96)}
  .lp-btn .flag{font-size:28px;display:block;margin-bottom:4px}

  /* ---------- login ---------- */
  #login{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;
    background:linear-gradient(160deg,#0f172a 0%,#1e3a8a 100%)}
  .login-card{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:32px 28px;width:100%;max-width:380px}
  .logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px}
  .logo .mark{width:44px;height:44px;border-radius:12px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}
  .logo h1{font-size:22px}
  .login-sub{text-align:center;color:var(--muted);margin-bottom:18px;font-size:14px}
  .langrow{display:flex;justify-content:center;gap:8px;margin-bottom:18px}
  .langbtn{border:1.5px solid var(--line);border-radius:999px;padding:7px 16px;font-size:13.5px;font-weight:600;color:var(--muted)}
  .langbtn.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
  .field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;outline:none}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:11px 18px;font-weight:600;transition:.15s}
  .btn-primary{background:var(--brand);color:#fff;width:100%}
  .btn-primary:active{background:var(--brand2)}
  .btn-ghost{background:var(--chip);color:var(--ink)}
  .btn-danger{background:#fee2e2;color:var(--bad)}
  .btn-sm{padding:7px 12px;font-size:13.5px;border-radius:8px}
  .err{color:var(--bad);font-size:13.5px;margin-top:10px;text-align:center;min-height:18px}

  /* ---------- shell ---------- */
  #app{min-height:100%}
  header{position:sticky;top:0;z-index:30;background:var(--brand);color:#fff;padding:0 14px}
  .hrow{display:flex;align-items:center;justify-content:space-between;height:54px;max-width:720px;margin:0 auto}
  .hrow .title{font-weight:700;font-size:17px}
  .bell{position:relative;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
  .bell:active{background:rgba(255,255,255,.15)}
  .bell .dot{position:absolute;top:5px;right:5px;min-width:17px;height:17px;border-radius:9px;background:#fbbf24;color:#7c2d12;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
  main{max-width:720px;margin:0 auto;padding:14px 14px calc(76px + env(safe-area-inset-bottom))}
  nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);
    display:flex;justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
  nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:11px;font-weight:600;padding:4px 0;border-radius:10px}
  nav button.on{color:var(--brand)}
  nav .ico{font-size:20px;line-height:1}

  /* ---------- pieces ---------- */
  .card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
  .row{display:flex;align-items:center;gap:10px}
  .grow{flex:1;min-width:0}
  .muted{color:var(--muted)}
  .small{font-size:12.5px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600;color:var(--muted)}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .badge{display:inline-block;border-radius:6px;padding:2px 8px;font-size:11.5px;font-weight:700}
  .b-pending{background:#fef3c7;color:#92400e}
  .b-in_progress{background:#dbeafe;color:#1e40af}
  .b-done{background:#dcfce7;color:#166534}
  .prio{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .p-baja{background:#94a3b8}.p-normal{background:#3b82f6}.p-alta{background:#f59e0b}.p-urgente{background:#ef4444}
  .overdue{color:var(--bad);font-weight:700}
  .empty{text-align:center;color:var(--muted);padding:40px 10px}
  .empty .big{font-size:40px;margin-bottom:8px}
  .fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;
    background:var(--brand);color:#fff;font-size:28px;box-shadow:0 4px 14px rgba(37,99,235,.4);z-index:25;display:flex;align-items:center;justify-content:center}
  .fab:active{transform:scale(.94)}

  /* ---------- modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
  @media(min-width:640px){.overlay{align-items:center}}
  .sheet{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;max-height:92vh;display:flex;flex-direction:column;animation:up .18s ease-out}
  @media(min-width:640px){.sheet{border-radius:18px}}
  @keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px}
  .sheet-head h2{font-size:17px}
  .sheet-body{overflow-y:auto;padding:4px 18px 18px}
  .x{width:34px;height:34px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:16px}

  .upd{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  .upd:first-child{border-top:none}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
  .upd .bubble{flex:1;min-width:0}
  .upd img{max-width:100%;border-radius:10px;margin-top:6px;max-height:300px;object-fit:cover}
  .statusbtns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
  .statusbtns button{border:1.5px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;background:#fff;color:var(--muted)}
  .statusbtns button.on{border-color:var(--ink);background:var(--ink);color:#fff}
  .photoPrev{position:relative;display:inline-block;margin-top:8px}
  .photoPrev img{height:110px;border-radius:10px}
  .photoPrev button{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;background:var(--bad);color:#fff;font-size:13px}

  /* calendar */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .cal-head h2{font-size:17px;font-weight:700}
  .cal-nav{width:38px;height:38px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:16px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:6px}
  .cal-dow{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:4px 0;text-transform:uppercase}
  .cal-cell{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;font-weight:600;position:relative;background:var(--bg);color:var(--ink);touch-action:manipulation;user-select:none}
  .cal-cell.other{opacity:.3}
  .cal-cell.today{outline:2px solid var(--brand);outline-offset:-2px}
  .cal-cell.sel{background:var(--brand);color:#fff}
  .cal-cell.has-ev{background:#f3e8ff}
  .cal-cell.sel.has-ev{background:#7c3aed}
  .cal-cell .dots{position:absolute;bottom:4px;display:flex;gap:2px}
  .cal-cell .dots .d{width:4px;height:4px;border-radius:50%;background:var(--brand)}
  .cal-cell.sel .dots .d{background:#fff}
  .cal-cell .dots .d.done{background:var(--ok)}
  .cal-cell.sel .dots .d.done{background:#bbf7d0}
  .cal-cell .dots .d.ev{background:#7c3aed}
  .cal-cell.sel .dots .d.ev{background:#e9d5ff}
  .openday{width:100%;background:var(--brand);color:#fff;border-radius:12px;padding:13px;font-weight:700;font-size:15px;margin:4px 0 16px;box-shadow:0 3px 10px rgba(37,99,235,.35)}
  .openday:active{background:var(--brand2)}

  /* day view */
  .day-back{display:flex;align-items:center;gap:8px;margin-bottom:14px;color:var(--brand);font-weight:600;font-size:14px}
  .day-back:active{opacity:.7}
  .day-date{font-size:20px;font-weight:800;margin-bottom:14px}
  .timeline-item{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start}
  .timeline-item:first-child{border-top:none}
  .timeline-item .ti-time{font-size:11px;font-weight:700;color:var(--muted);min-width:42px;padding-top:2px}
  .timeline-item .ti-body{flex:1;min-width:0}
  .timeline-item .ti-icon{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;background:var(--chip)}
  .tl-task{border-left:3px solid var(--brand);padding-left:12px}
  .tl-ev{border-left:3px solid #7c3aed;padding-left:12px}

  /* collapsible responses in day view */
  .resp-toggle{cursor:pointer}
  .resp-wrap{overflow:hidden;transition:max-height .25s ease;max-height:0}
  .resp-wrap.open{max-height:1200px;overflow-y:auto}
  .chev{font-size:11px;color:var(--muted);transition:transform .2s}
  .resp-toggle.open .chev{transform:rotate(90deg)}

  /* checklist */
  .ckrow{display:flex;align-items:flex-start;gap:10px;padding:8px 0}
  .ckrow .ckbox{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);background:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;font-weight:800}
  .ckrow.done .ckbox{background:var(--ok);border-color:var(--ok)}
  .ckrow.done .cktext{text-decoration:line-through;color:var(--muted)}
  .ckrow .cktext{flex:1;padding-top:1px}
  .ckrow .ckmeta{font-size:11px;color:var(--muted)}
  .ckbar{height:5px;border-radius:3px;background:var(--chip);overflow:hidden;margin:8px 0 4px}
  .ckbar div{height:100%;background:var(--ok);transition:width .25s}

  /* camera */
  #cam-view{position:fixed;inset:0;background:#000;z-index:80;display:flex;flex-direction:column}
  #cam-view video{flex:1;object-fit:contain;width:100%}
  .cam-bar{display:flex;justify-content:space-around;align-items:center;padding:16px 0 calc(16px + env(safe-area-inset-bottom));background:#000}
  .cam-btn{width:64px;height:64px;border-radius:50%;background:#fff;border:4px solid rgba(255,255,255,.4)}
  .cam-btn:active{transform:scale(.92)}
  .cam-x{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;font-size:18px;z-index:2}
  .cam-ts{position:absolute;bottom:110px;left:0;right:0;text-align:center;color:#fff;font-weight:700;font-size:15px;text-shadow:0 1px 4px rgba(0,0,0,.9);pointer-events:none}
  .shotPrev{position:relative;display:inline-block;margin:6px 6px 0 0}
  .shotPrev img{width:74px;height:74px;object-fit:cover;border-radius:10px}
  .shotPrev button{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;background:var(--bad);color:#fff;font-size:12px}
  .multiPrev{display:flex;flex-wrap:wrap}
  .ev-badge{display:inline-flex;align-items:center;gap:5px;background:#f3e8ff;color:#6b21a8;border-radius:6px;padding:2px 8px;font-size:11.5px;font-weight:700}

  /* team */
  .userrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
  .userrow:first-child{border-top:none}
  .switch{position:relative;width:44px;height:26px;border-radius:13px;background:#cbd5e1;transition:.15s;flex-shrink:0}
  .switch.on{background:var(--ok)}
  .switch::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
  .switch.on::after{left:21px}

  .notif{display:flex;gap:10px;padding:11px 0;border-top:1px solid var(--line);align-items:flex-start}
  .notif:first-child{border-top:none}
  .notif .ni{font-size:18px}
  .notif.unread{background:#eff6ff;margin:0 -18px;padding:11px 18px;border-top-color:#bfdbfe}

  .sect{font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 2px 8px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;
    padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:60;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
  .toast.show{opacity:1}
  textarea{resize:vertical;min-height:70px}
  .del-x{color:var(--bad);font-weight:700;font-size:16px;width:30px;height:30px;border-radius:8px}
  .del-x:active{background:#fee2e2}
  .meta-line{font-size:12px;color:var(--muted);margin-top:4px}
</style>
</head>
<body>

<!-- ============ LANGUAGE PICK ============ -->
<div id="lang-pick">
  <div class="lp-logo"><div class="mark">GE</div><h1>GE Actividades</h1></div>
  <div class="lp-sub">Tareas, avances y horarios / Tasks, updates & schedules</div>
  <button class="lp-btn" id="lp-es"><span class="flag">🇪🇸</span>Español</button>
  <button class="lp-btn" id="lp-en"><span class="flag">🇬🇧</span>English</button>
</div>

<!-- ============ LOGIN ============ -->
<div id="login" class="hidden">
  <div class="login-card">
    <div class="logo"><div class="mark">GE</div><h1>GE Actividades</h1></div>
    <div class="login-sub" id="lg-sub"></div>
    <div class="langrow">
      <button class="langbtn" id="lang-es">Español</button>
      <button class="langbtn" id="lang-en">English</button>
    </div>
    <div class="field"><label id="lg-user-label"></label><input id="li-user" autocapitalize="none" autocorrect="off" autocomplete="username"></div>
    <div class="field"><label id="lg-pass-label"></label><input id="li-pass" type="password" autocomplete="current-password"></div>
    <button class="btn btn-primary" id="li-btn"></button>
    <div class="err" id="li-err"></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <header><div class="hrow">
    <div class="title" id="h-title"></div>
    <button class="bell" id="bell">🔔<span class="dot hidden" id="bell-dot">0</span></button>
  </div></header>
  <main id="main"></main>
  <button class="fab hidden" id="fab">+</button>
  <nav id="nav"></nav>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="file-in" accept="image/*" class="hidden">

<script>

let LANG = localStorage.getItem('ge_lang') || '';

let tab = 'calendar';
let taskFilter = 'open';

let dayOpen = false;      // full-screen day view open
let dayExpanded = {};     // itemId -> responses expanded

const STR = {

    tasksForDay:'Tareas', activityForDay:'Actividad del día',
    taskCreated2:'Tarea creada', taskCompleted2:'Completada', taskReopened:'Reabierta',
    taskDeleted2:'Tarea eliminada', taskReassigned2:'Reasignada',
    updateAdded:'Avance añadido', userCreated:'Usuario creado', userUpdated:'Usuario modificado', userDeleted:'Usuario eliminado',
    scheduleCreated2:'Horario creado', scheduleDeleted2:'Horario eliminado',
    atTime:'a las', by:'por', assignedTo2:'Asignada a', createdFrom:'Creada por',
    completedAt:'Completada', completedBy:'por', noTasks:'Sin tareas para este día.',
    n_assigned:' te asignó: ', n_moved:' movió «', n_to:'» a ', n_updateIn:' añadió un avance en «',

function t(k){ return (STR[LANG] && STR[LANG][k]) || k; }

const PR_KEY = {baja:'pr_baja', normal:'pr_normal', alta:'pr_alta', urgente:'pr_urgente'};
const ROLE_KEY = {admin:'role_admin', subadmin:'role_subadmin', employee:'role_employee'};
function stEs(s){ return t(ST_KEY[s]||s); }
function prEs(p){ return t(PR_KEY[p]||p); }
function roleEs(r){ return t(ROLE_KEY[r]||r); }
const isManager = () => ME && (ME.role === 'admin' || ME.role === 'subadmin');

function applyLang() {
  document.documentElement.lang = LANG;
  $('#lang-es').classList.toggle('on', LANG === 'es');
  $('#lang-en').classList.toggle('on', LANG === 'en');
  $('#lg-sub').textContent = t('subtitle');
  $('#lg-user-label').textContent = t('user');
  $('#lg-pass-label').textContent = t('password');
  $('#li-btn').textContent = t('enter');

  if (ME) { buildNav(); render(); }
}
$('#lp-es').onclick = () => { LANG='es'; showLogin(); };
$('#lp-en').onclick = () => { LANG='en'; showLogin(); };

$('#lang-en').onclick = () => { LANG='en'; applyLang(); };

function showLogin() {
  $('#lang-pick').classList.add('hidden');
  $('#login').classList.remove('hidden');

}

function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if (token) opts.headers['Authorization'] = 'Bearer ' + token;
  return fetch(path, opts).then(async r => {
    let j = {}; try { j = await r.json(); } catch(e) {}
    if (!r.ok) { const e = new Error(j.error || t('errGeneric')); e.status = r.status; throw e; }
    return j;
  });
}
function toast(msg) {
  const tt = $('#toast'); tt.textContent = msg; tt.classList.add('show');
  clearTimeout(tt._h); tt._h = setTimeout(()=>tt.classList.remove('show'), 2400);
}
function fmtDate(d) {
  if (!d) return '';
  return new Date(d + 'T12:00:00').toLocaleDateString(LANG, {weekday:'long', day:'numeric', month:'long'});
}
function fmtDateShort(d) {
  if (!d) return '';
  return new Date(d + 'T12:00:00').toLocaleDateString(LANG, {weekday:'short', day:'numeric', month:'short'});
}
function fmtTime(ts) { return new Date(ts).toLocaleTimeString(LANG, {hour:'2-digit', minute:'2-digit'}); }
function fmtTs(ts) {
  const dt = new Date(ts), now = new Date();
  const same = dt.toDateString() === now.toDateString();
  return same ? fmtTime(ts) : dt.toLocaleDateString(LANG,{day:'numeric',month:'short'}) + ' ' + fmtTime(ts);
}
function initials(name){ return (name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function isOverdue(t2){ return t2.due && t2.status !== 'done' && t2.due < new Date().toISOString().slice(0,10); }
function pad2(n){ return String(n).padStart(2,'0'); }

/* ---------------- auth ---------------- */
$('#li-btn').onclick = doLogin;
$('#li-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
async function doLogin() {
  $('#li-err').textContent = '';
  try {
    const r = await api('/api/login', {method:'POST', body:JSON.stringify({
      username:$('#li-user').value.trim(), password:$('#li-pass').value})});
    token = r.token; ME = r.user;
    localStorage.setItem('ge_token', token);
    enterApp();
  } catch(e) {
    $('#li-err').textContent = e.status === 401 ? t('badLogin') : e.status === 429 ? t('rateLimited') : e.message;
  }
}
async function logout() {
  try { await api('/api/logout', {method:'POST'}); } catch(e) {}
  localStorage.removeItem('ge_token'); token = ''; ME = null;
  if (evSource) { evSource.close(); evSource = null; }
  location.reload();
}

/* ---------------- boot ---------------- */
async function boot() {
  if (!LANG) { return; } // show language pick
  showLogin();
  if (!token) return;
  try {
    const me = await api('/api/me');
    ME = me.user; enterApp();
  } catch(e) { localStorage.removeItem('ge_token'); token=''; }
}
function enterApp() {
  $('#login').classList.add('hidden');
  $('#lang-pick').classList.add('hidden');
  $('#app').classList.remove('hidden');
  buildNav(); connectEvents(); refreshAll();
}
function connectEvents() {
  if (evSource) evSource.close();
  evSource = new EventSource('/api/events');
  evSource.onmessage = () => refreshAll(true);
}

/* ---------------- data refresh ---------------- */
async function refreshAll() {
  if (!ME) return;
  try {
    const jobs = [api('/api/tasks'), api('/api/notifications'), api('/api/log'), api('/api/schedule'), api('/api/milestones')];
    if (isManager()) jobs.push(api('/api/users'));
    const [t1, n, lg, sc, mi, u] = await Promise.all(jobs);
    TASKS = t1.tasks; LOG = lg.log; SCHEDULE = sc.schedule; MILES = mi.milestones;
    if (u) USERS = u.users;
    renderBell(n.unread); render();
  } catch(e) { if (e.status === 401) logout(); }
}
function renderBell(n) {
  const d = $('#bell-dot');
  if (n > 0) { d.textContent = n > 99 ? '99+' : n; d.classList.remove('hidden'); }
  else d.classList.add('hidden');
}

/* ---------------- render root ---------------- */
function render() {
  const m = $('#main'); m.innerHTML = '';

  else if (tab === 'calendar') renderCalendar(m);
  else if (tab === 'tasks') renderTasks(m);
  else if (tab === 'team') renderTeam(m);

/* ================= CALENDAR ================= */
function renderCalendar(m) {
  // Build month grid
  const y = calMonth.getFullYear(), mo = calMonth.getMonth();
  const monthName = calMonth.toLocaleDateString(LANG, {month:'long', year:'numeric'});
  const firstDay = new Date(y, mo, 1);
  const startDow = firstDay.getDay(); // 0=Sun
  const daysInMonth = new Date(y, mo+1, 0).getDate();
  const prevMonthDays = new Date(y, mo, 0).getDate();

  const head = el('div','cal-head');
  head.innerHTML = '<button class="cal-nav" id="cal-prev">‹</button><h2>' + esc(monthName) + '</h2><button class="cal-nav" id="cal-next">›</button>';
  m.appendChild(head);
  head.querySelector('#cal-prev').onclick = () => { calMonth.setMonth(mo-1); render(); };
  head.querySelector('#cal-next').onclick = () => { calMonth.setMonth(mo+1); render(); };

  // DOW labels
  const grid = el('div','cal-grid');
  const dows = LANG === 'es' ? ['D','L','M','X','J','V','S'] : ['S','M','T','W','T','F','S'];
  dows.forEach(d => grid.appendChild(el('div','cal-dow', d)));
  m.appendChild(grid);

  const grid2 = el('div','cal-grid');
  const todayStr = new Date().toISOString().slice(0,10);

  // Build a map of date -> {hasTask, hasDone, hasActivity, hasEv}
  const dayMap = {};
  const addDay = (d, type) => { (dayMap[d] = dayMap[d] || {})[type] = true; };
  TASKS.forEach(t2 => { if (t2.due) addDay(t2.due, t2.status === 'done' ? 'done' : 'task'); });
  LOG.forEach(e => { addDay((e.ts||'').slice(0,10), 'activity'); });
  MILES.forEach(mi => { addDay(mi.date, 'ev'); });

  // prev month padding
  for (let i = startDow - 1; i >= 0; i--) {
    grid2.appendChild(el('div','cal-cell other', String(prevMonthDays - i)));
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const dStr = y + '-' + pad2(mo+1) + '-' + pad2(d);
    const info = dayMap[dStr] || {};
    const cls = 'cal-cell' + (dStr === todayStr ? ' today' : '') + (dStr === calSelected ? ' sel' : '') + (info.ev ? ' has-ev' : '');
    const cell = el('div', cls, String(d));
    if (info.task || info.done || info.activity || info.ev) {
      const dots = el('div','dots');
      if (info.task) dots.appendChild(el('div','d'));
      if (info.done) dots.appendChild(el('div','d done'));
      if (info.ev) dots.appendChild(el('div','d ev'));
      if (info.activity && !info.task && !info.done && !info.ev) dots.appendChild(el('div','d'));
      cell.appendChild(dots);
    }
    // SINGLE TAP: select + show quick list at bottom of homepage
    cell.onclick = () => { calSelected = dStr; render(); };
    grid2.appendChild(cell);
  }
  // next month padding
  const totalCells = startDow + daysInMonth;
  const remain = (7 - (totalCells % 7)) % 7;
  for (let d = 1; d <= remain; d++) grid2.appendChild(el('div','cal-cell other', String(d)));
  m.appendChild(grid2);

  // Open-day button under the grid
  const ob = el('button','openday', '📆 ' + t('openDay') + ' — ' + fmtDateShort(calSelected));
  ob.onclick = () => { dayOpen = true; render(); };
  m.appendChild(ob);

  // Selected day: quick list at the bottom of the homepage
  renderDaySummary(m);
}

/* Quick list of the selected day at the bottom of the homepage (single tap) */

  const ds = calSelected;
  const dayTasks = TASKS.filter(t2 => t2.due === ds);
  const dayEvs = MILES.filter(mi => mi.date === ds);
  if (!dayTasks.length && !dayEvs.length) {
    m.appendChild(el('div','small muted', fmtDate(ds) + ' · ' + t('noTasks')));
    return;
  }
  m.appendChild(el('div','sect', fmtDate(ds)));
  dayEvs.forEach(mi => {
    const c = el('div','card tl-ev');
    c.innerHTML = '<div class="row"><span>🎉</span><div class="grow"><div style="font-weight:700">' + esc(mi.title) + '</div>' +
      '<div class="meta-line">' + t('milestoneCreated2') + ' ' + t('by') + ' ' + esc(mi.createdByName||'') +
      (mi.start ? ' · ' + mi.start : '') + '</div></div></div>';
    c.onclick = () => { dayOpen = true; render(); };
    m.appendChild(c);
  });
  dayTasks.forEach(t2 => {
    const card = el('div','card tl-task');
    const mine = t2.assignee === ME.id;
    let html = '<div class="row" style="align-items:flex-start">' +
      '<div class="prio p-' + esc(t2.priority) + '" style="margin-top:7px"></div>' +
      '<div class="grow">' +
        '<div style="font-weight:700">' + esc(t2.title) + '</div>' +
        '<div class="meta-line">' + t('assignedTo2') + ' <b>' + esc(t2.assigneeName) + '</b>' + (mine ? ' ' + t('you') : '') + '</div>' +
        '<div class="meta-line">' + t('createdFrom') + ' ' + esc(t2.createdByName) + ' · ' + fmtTs(t2.createdAt) + '</div>';
    if (t2.status === 'done') {
      html += '<div class="meta-line" style="color:var(--ok)">' + t('completedAt') + ' ' + fmtTs(t2.completedAt) + ' ' + t('completedBy') + ' ' + esc(t2.completedByName||'—') + '</div>';
    }
    html += '</div><span class="badge b-' + esc(t2.status) + '">' + stEs(t2.status) + '</span></div>';
    card.innerHTML = html;
    card.onclick = () => openTask(t2.id);
    m.appendChild(card);
  });
}

/* ============ FULL-SCREEN DAY VIEW (Open day) ============ */
function renderDayView(m) {
  const ds = calSelected;
  const back = el('button','day-back', t('backToCal'));
  back.onclick = () => { dayOpen = false; dayExpanded = {}; render(); };
  m.appendChild(back);
  m.appendChild(el('div','day-date', fmtDate(ds)));

  // Events first
  const dayEvs = MILES.filter(mi => mi.date === ds);
  if (dayEvs.length) {
    m.appendChild(el('div','sect', t('eventsForDay')));
    dayEvs.forEach(mi => m.appendChild(milestoneCard(mi)));
  }

  // Tasks with collapsible responses
  const dayTasks = TASKS.filter(t2 => t2.due === ds);
  m.appendChild(el('div','sect', t('tasksForDay')));
  if (!dayTasks.length) {
    m.appendChild(el('div','small muted', t('noTasks')));
  } else {
    dayTasks.forEach(t2 => m.appendChild(dayTaskCard(t2)));
  }

  // Activity log for this day
  const dayLog = LOG.filter(e => (e.ts||'').slice(0,10) === ds).sort((a,b) => (a.ts||'').localeCompare(b.ts||''));
  m.appendChild(el('div','sect', t('activityForDay')));
  if (!dayLog.length) {
    m.appendChild(el('div','small muted', t('noActivity')));
  } else {
    dayLog.forEach(e => m.appendChild(logItem(e)));
  }
}

/* Task card in the day view — clean; responses hidden until tapped */
function dayTaskCard(t2) {
  const c = el('div','card tl-task');
  const mine = t2.assignee === ME.id;
  const ck = t2.checklist || [];
  const ckDone = ck.filter(x => x.done).length;
  let html = '<div class="row" style="align-items:flex-start">' +
    '<div class="prio p-' + esc(t2.priority) + '" style="margin-top:7px"></div>' +
    '<div class="grow">' +
      '<div style="font-weight:700">' + esc(t2.title) + '</div>' +
      '<div class="meta-line">' + t('assignedTo2') + ' <b>' + esc(t2.assigneeName) + '</b>' + (mine ? ' ' + t('you') : '') + '</div>' +
      '<div class="meta-line">' + t('createdFrom') + ' ' + esc(t2.createdByName) + ' · ' + fmtTs(t2.createdAt) + '</div>';
  if (t2.status === 'done') {
    html += '<div class="meta-line" style="color:var(--ok)">' + t('completedAt') + ' ' + fmtTs(t2.completedAt) + ' ' + t('completedBy') + ' ' + esc(t2.completedByName||'—') + '</div>';
  }
  if (ck.length) {
    html += '<div class="ckbar"><div style="width:' + Math.round(ckDone/ck.length*100) + '%"></div></div>' +
      '<div class="meta-line">' + ckDone + '/' + ck.length + ' ' + t('ckProgress') + '</div>';
  }
  html += '</div><span class="badge b-' + esc(t2.status) + '">' + stEs(t2.status) + '</span></div>';
  c.innerHTML = html;

  // checklist rows (always visible for assignee/manager — the working surface)
  if (ck.length && (isManager() || mine)) {
    ck.forEach(item => c.appendChild(ckRow(t2, item)));
  }

  // collapsible responses
  const key = t2.id;
  const tog = el('div','resp-toggle');
  const isOpen = !!dayExpanded[key];
  tog.innerHTML = '<div class="row small muted" style="padding:8px 0 0"><span class="chev">▶</span> ' +
    (isOpen ? t('hide') : t('tapToSee') + ' (' + (t2.updateCount||0) + ')') + '</div>';
  const wrap = el('div','resp-wrap' + (isOpen ? ' open' : ''));
  if (isOpen) fillResponses(wrap, t2.id);
  tog.onclick = () => {
    dayExpanded[key] = !dayExpanded[key];
    if (dayExpanded[key]) { wrap.classList.add('open'); fillResponses(wrap, t2.id); tog.classList.add('open'); }
    else { wrap.classList.remove('open'); wrap.innerHTML = ''; tog.classList.remove('open'); }
    const lbl = tog.querySelector('.row');
    lbl.innerHTML = '<span class="chev">▶</span> ' + (dayExpanded[key] ? t('hide') : t('tapToSee') + ' (' + (t2.updateCount||0) + ')');
  };
  tog.classList.toggle('open', isOpen);
  c.appendChild(tog); c.appendChild(wrap);
  // open full task detail on title tap
  c.querySelector('.row').onclick = () => openTask(t2.id);
  return c;
}

async function fillResponses(wrap, taskId) {
  wrap.innerHTML = '<div class="small muted" style="padding:6px 0">…</div>';
  try {
    const d = await api('/api/tasks/' + taskId);
    wrap.innerHTML = '';
    if (!d.updates.length) wrap.appendChild(el('div','small muted', '—'));
    d.updates.forEach(u2 => {
      const r = el('div','upd');
      r.innerHTML = '<div class="avatar">' + esc(initials(u2.authorName)) + '</div>' +

/* ---------- task detail ---------- */
async function openTask(id) {
  let d;
  try { d = await api('/api/tasks/' + id); } catch(e) { toast(e.message); return; }
  const x = d.task, updates = d.updates;
  const manager = isManager();
  const mine = x.assignee === ME.id;

  const ov = el('div','overlay');
  const sheet = el('div','sheet');
  sheet.innerHTML =
    '<div class="sheet-head"><h2>' + esc(x.title) + '</h2><button class="x">✕</button></div>' +
    '<div class="sheet-body">' +
      '<div class="meta-line">' + t('assignedTo') + ' <b style="color:var(--ink)">' + esc(x.assigneeName) + '</b> · ' + t('createdBy') + ' ' + esc(x.createdByName) + '</div>' +

      (x.completedAt ? '<div class="meta-line" style="color:var(--ok)">' + t('completedAt') + ' ' + fmtTs(x.completedAt) + ' ' + t('completedBy') + ' ' + esc(x.completedByName||'—') + '</div>' : '') +

        (x.due ? '<span class="' + (isOverdue(x)?'overdue':'muted') + '">' + t('due') + ' ' + fmtDateShort(x.due) + '</span>' : '') +
      '</div>' +
      (x.desc ? '<div style="margin:10px 0;white-space:pre-wrap;background:var(--chip);border-radius:10px;padding:12px">' + esc(x.desc) + '</div>' : '') +
    '</div>';
  const body = sheet.querySelector('.sheet-body');

  // checklist (working surface): tap an item to toggle; auto-complete when all done
  const ck = x.checklist || [];
  if (ck.length) {
    const ckDone = ck.filter(i => i.done).length;
    const wrap = el('div');
    wrap.appendChild(el('div','sect', t('checklist') + ' — ' + ckDone + '/' + ck.length));
    const bar = el('div','ckbar','<div style="width:' + Math.round(ckDone/ck.length*100) + '%"></div>');
    wrap.appendChild(bar);
    ck.forEach(item => wrap.appendChild(ckRow(x, item)));
    body.appendChild(wrap);
  }

  // status buttons (hidden for checklist tasks — status is automatic)
  const canSet = (manager || mine) && !ck.length;
  if (canSet) {
    let opts;
    if (manager) opts = ['pending','in_progress','done'];
    else {
      const map = { pending:['in_progress','done'], in_progress:['done'], done:[] };
      opts = map[x.status] || [];
    }
    if (opts.length) {
      const wrap = el('div');
      wrap.appendChild(el('div','sect', t('status')));
      const row = el('div','statusbtns');
      opts.forEach(s => {
        const b = el('button', s === x.status ? 'on' : '', stEs(s));
        b.onclick = async () => {
          try { await api('/api/tasks/' + x.id, {method:'PATCH', body:JSON.stringify({status:s})});
            ov.remove(); refreshAll(); toast(t('stateNow') + ' ' + stEs(s)); }
          catch(e) { toast(e.message); }
        };
        row.appendChild(b);
      });
      wrap.appendChild(row); body.appendChild(wrap);
    }
  }

  // admin edit + delete
  if (ME.role === 'admin') {
    const row = el('div','row');
    const eb = el('button','btn btn-ghost btn-sm', t('edit'));
    eb.onclick = () => { ov.remove(); taskForm(x); };
    const db = el('button','btn btn-danger btn-sm', t('delete'));
    db.onclick = async () => {
      if (!confirm(t('confirmDelTask') + ' "' + x.title + '"? ' + t('noUndo'))) return;
      try { await api('/api/tasks/' + x.id, {method:'DELETE'}); ov.remove(); refreshAll(); toast(t('taskDeleted')); }
      catch(e) { toast(e.message); }
    };
    row.append(eb, db);
    body.appendChild(el('div','sect', t('adminSect')));
    body.appendChild(row);
  }

  // updates
  body.appendChild(el('div','sect', t('updates') + ' (' + updates.length + ')'));
  if (!updates.length) body.appendChild(el('div','small muted','—'));
  updates.forEach(u => {
    const d2 = el('div','upd');
    d2.innerHTML = '<div class="avatar">' + esc(initials(u.authorName)) + '</div>' +
      '<div class="bubble"><div class="small"><b>' + esc(u.authorName) + '</b> <span class="muted">· ' + fmtTs(u.ts) + '</span></div>' +
      (u.text ? '<div style="white-space:pre-wrap;margin-top:2px">' + esc(u.text) + '</div>' : '') +
      ((u.photos||[]).length ? '<div class="multiPrev">' + u.photos.map(p => '<img loading="lazy" src="' + esc(p) + '">').join('') + '</div>' : '') +
      '</div>';
    body.appendChild(d2);
  });

  // add update — all roles; photos via camera or gallery, up to 20 at once
  const canUpdate = manager || mine;
  if (canUpdate) {
    body.appendChild(el('div','sect', t('addUpdate')));
    const ta = el('textarea'); ta.placeholder = manager ? t('phAdminComment') : t('phEmployee');
    ta.style.width = '100%';
    let photoUrls = [];
    const prev = el('div','multiPrev');
    const camBtn = el('button','btn btn-ghost btn-sm', t('camera'));
    const galBtn = el('button','btn btn-ghost btn-sm', t('gallery'));
    const sendBtn = el('button','btn btn-primary btn-sm', t('send'));
    camBtn.onclick = () => openCamera(async dataUrl => {
      if (photoUrls.length >= 20) { toast('20 max'); return; }
      try {
        const r = await api('/api/upload', {method:'POST', body:JSON.stringify({dataUrl})});
        photoUrls.push(r.url); renderPrev();
      } catch(e) { toast(t('uploadFail') + e.message); }
    });
    galBtn.onclick = () => pickPhotos(urls => {
      urls.forEach(u2 => { if (photoUrls.length < 20) photoUrls.push(u2); });
      renderPrev();
    });
    function renderPrev() {
      prev.innerHTML = '';
      photoUrls.forEach((p, i) => {
        const s = el('div','shotPrev','<img src="' + esc(p) + '">');
        const xx = el('button','x','✕');
        xx.onclick = () => { photoUrls.splice(i,1); renderPrev(); };
        s.appendChild(xx); prev.appendChild(s);
      });
    }
    const row = el('div','row'); row.append(camBtn, galBtn, sendBtn);
    body.append(ta, prev, row);
    sendBtn.onclick = async () => {
      const text = ta.value.trim();
      if (!text && !photoUrls.length) { toast(t('writeSomething')); return; }
      sendBtn.disabled = true;
      try {
        await api('/api/tasks/' + x.id + '/updates', {method:'POST', body:JSON.stringify({text, photos:photoUrls})});
        ov.remove(); refreshAll(); toast(t('updatePosted'));
      } catch(e) { toast(e.message); sendBtn.disabled = false; }
    };
  }

  sheet.querySelector('.x').onclick = () => ov.remove();
  ov.onclick = e => { if (e.target === ov) ov.remove(); };
  ov.appendChild(sheet); document.body.appendChild(ov);
}

/* live camera with burned-in timestamp */
function openCamera(onShot) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { toast(t('camNotAvailable')); return; }
  let stream = null;
  const view = el('div'); view.id = 'cam-view';
  view.innerHTML = '<video autoplay playsinline muted></video>' +
    '<div class="cam-ts" id="cam-ts"></div>' +
    '<button class="cam-x">✕</button>' +
    '<div class="cam-bar"><button class="cam-btn" id="cam-shoot"></button></div>';
  document.body.appendChild(view);
  const video = view.querySelector('video');
  const tsEl = view.querySelector('#cam-ts');
  const tsTimer = setInterval(() => { tsEl.textContent = new Date().toLocaleString(LANG); }, 500);
  tsEl.textContent = new Date().toLocaleString(LANG);
  const close = () => { clearInterval(tsTimer); if (stream) stream.getTracks().forEach(tr => tr.stop()); view.remove(); };
  view.querySelector('.cam-x').onclick = close;
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
    .then(s => { stream = s; video.srcObject = s; })
    .catch(() => { toast(t('camNotAvailable')); close(); });
  view.querySelector('#cam-shoot').onclick = () => {
    if (!stream || !video.videoWidth) return;
    const cv = document.createElement('canvas');
    const w = Math.min(1600, video.videoWidth);
    const h = Math.round(video.videoHeight * (w / video.videoWidth));
    cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d');
    ctx.drawImage(video, 0, 0, w, h);
    // burn timestamp into the image
    const stamp = new Date().toLocaleString(LANG) + ' · GE Actividades';
    ctx.font = Math.round(w * 0.032) + 'px sans-serif';
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    const tw = ctx.measureText(stamp).width;
    ctx.fillRect(10, h - Math.round(w*0.032) - 22, tw + 20, Math.round(w*0.032) + 16);
    ctx.fillStyle = '#fff';
    ctx.fillText(stamp, 20, h - 16);
    onShot(cv.toDataURL('image/jpeg', 0.85));
    close();
  };
}
function resizeImage(file, maxDim, q) {
  return new Promise((resolve, reject) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      let w = img.width, h = img.height;
      const scale = Math.min(1, maxDim / Math.max(w, h));
      w = Math.round(w*scale); h = Math.round(h*scale);
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url); resolve(cv.toDataURL('image/jpeg', q));
    };
    img.onerror = reject; img.src = url;
  });
}

    const row = el('div','row'); row.style.marginBottom = '6px';

    inp.value = val || '';
    inp.placeholder = t('checkItem');
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); addRow(''); editor.lastChild.querySelector('input').focus(); }
      else if (e.key === 'Backspace' && inp.value === '') {
        e.preventDefault();
        if (editor.children.length > 1) {
          const prev = row.previousElementSibling;
          row.remove(); if (prev) prev.querySelector('input').focus();
        }
      }
    });
    row.appendChild(inp); editor.appendChild(row);
    return row;
  }
  // prefill: from existing checklist, or one empty row
  const prefill = existing && (existing.checklist||[]).length
    ? existing.checklist.map(i => i.text)
    : (existing && existing.desc ? existing.desc.split('\n') : ['']);

  sheet.querySelectorAll('#sf-users .chip').forEach(b => { b.onclick = () => b.classList.toggle('on'); });
  sheet.querySelector('#sf-save').onclick = async () => {
    const userIds = [...sheet.querySelectorAll('#sf-users .chip.on')].map(b => b.dataset.id);
    const payload = {
      title: sheet.querySelector('#sf-title').value.trim(),
      date: sheet.querySelector('#sf-date').value,
      start: sheet.querySelector('#sf-start').value || null,
      end: sheet.querySelector('#sf-end').value || null,
      notes: sheet.querySelector('#sf-notes').value.trim(),
      userIds,
    };
    if (!payload.title) { toast(t('needTitle')); return; }
    if (!payload.date) { toast(t('needDate')); return; }
    try {
      if (isEdit) await api('/api/schedule/' + existing.id, {method:'PATCH', body:JSON.stringify(payload)});
      else await api('/api/schedule', {method:'POST', body:JSON.stringify(payload)});
      ov.remove(); refreshAll(); toast(isEdit ? t('updated') : t('schedCreated'));
    } catch(e) { toast(e.message); }
  };
  ov.appendChild(sheet); document.body.appendChild(ov);
  setTimeout(() => sheet.querySelector('#sf-title').focus(), 80);
}

/* ================= TEAM (admin) ================= */
function renderTeam(m) {
  const add = el('button','btn btn-primary', t('addPerson'));
  add.style.marginBottom = '14px'; add.onclick = () => userForm();
  m.appendChild(add);
  const card = el('div','card');
  USERS.forEach(u => {
    const r = el('div','userrow');
    const canDelete = ME.role === 'admin' && u.id !== ME.id;
    r.innerHTML =
      '<div class="avatar" style="background:' + (u.role === 'admin' ? '#7c3aed' : u.role === 'subadmin' ? '#0891b2' : 'var(--brand)') + '">' + esc(initials(u.name)) + '</div>' +
      '<div class="grow"><div style="font-weight:700">' + esc(u.name) + (u.id === ME.id ? ' <span class="muted small">' + t('you') + '</span>' : '') + '</div>' +
      '<div class="small muted">@' + esc(u.username) + ' · ' + roleEs(u.role) + (u.active ? '' : ' · <b style="color:var(--bad)">' + t('inactive') + '</b>') + '</div></div>' +
      (u.id !== ME.id && ME.role === 'admin' ? '<div class="switch' + (u.active ? ' on' : '') + '"></div>' : '') +
      (ME.role === 'admin' ? '<button class="btn btn-ghost btn-sm">' + t('edit') + '</button>' : '') +
      (canDelete ? '<button class="del-x">🗑</button>' : '');
    const sw = r.querySelector('.switch');
    if (sw) sw.onclick = async () => {
      try { await api('/api/users/' + u.id, {method:'PATCH', body:JSON.stringify({active:!u.active})});
        refreshAll(); toast(u.name + ' ' + (u.active ? t('deactivated') : t('activated'))); }
      catch(e) { toast(e.message); }
    };
    const editBtn = r.querySelector('.btn');
    if (editBtn) editBtn.onclick = () => userForm(u);
    const delBtn = r.querySelector('.del-x');
    if (delBtn) delBtn.onclick = async () => {
      if (!confirm(t('confirmDelUser') + ' ' + u.name + '?')) return;
      try { await api('/api/users/' + u.id, {method:'DELETE'}); refreshAll(); toast(t('userDeletedMsg')); }
      catch(e) { toast(e.message); }
    };
    card.appendChild(r);
  });
  m.appendChild(card);
  m.appendChild(el('div','small muted', t('inactiveNote')));
}
function userForm(existing) {
  const isEdit = !!existing;
  const ov = el('div','overlay'); const sheet = el('div','sheet');
  sheet.innerHTML =
    '<div class="sheet-head"><h2>' + (isEdit ? esc(existing.name) : t('newPerson')) + '</h2><button class="x">✕</button></div>' +
    '<div class="sheet-body">' +
      '<div class="field"><label>' + t('name') + '</label><input id="uf-name" maxlength="60" value="' + esc(existing?existing.name:'') + '"></div>' +
      (isEdit ? '' : '<div class="field"><label>' + t('usernameFor') + '</label><input id="uf-user" autocapitalize="none" placeholder="ej. juan.perez"></div>') +
      '<div class="field"><label>' + (isEdit ? t('newPassOpt') : t('password')) + '</label><input id="uf-pass" type="text" placeholder="' + t('passMin') + '"></div>' +
      '<div class="field"><label>' + t('role') + '</label><select id="uf-role">' +
        ['employee','subadmin','admin'].map(r => '<option value="' + r + '"' + (existing && existing.role === r ? ' selected' : '') + '>' + roleEs(r) + '</option>').join('') +
      '</select></div>' +
      '<button class="btn btn-primary" id="uf-save">' + (isEdit ? t('save') : t('createAccount')) + '</button>' +
    '</div>';
  sheet.querySelector('.x').onclick = () => ov.remove();
  ov.appendChild(sheet); document.body.appendChild(ov);
  sheet.querySelector('#uf-save').onclick = async () => {
    try {
      if (isEdit) {
        const payload = {name: sheet.querySelector('#uf-name').value.trim(), role: sheet.querySelector('#uf-role').value};
        const pw = sheet.querySelector('#uf-pass').value; if (pw) payload.password = pw;
        await api('/api/users/' + existing.id, {method:'PATCH', body:JSON.stringify(payload)});
      } else {
        await api('/api/users', {method:'POST', body:JSON.stringify({
          name: sheet.querySelector('#uf-name').value.trim(),
          username: sheet.querySelector('#uf-user').value.trim(),
          password: sheet.querySelector('#uf-pass').value,
          role: sheet.querySelector('#uf-role').value})});
      }
      ov.remove(); refreshAll(); toast(isEdit ? t('saved') : t('accountCreated'));
    } catch(e) { toast(e.message); }
  };
}

/* ================= NOTIFICATIONS ================= */
$('#bell').onclick = async () => {
  let d;
  try { d = await api('/api/notifications'); } catch(e) { return; }
  const ov = el('div','overlay'); const sheet = el('div','sheet');
  sheet.innerHTML = '<div class="sheet-head"><h2>' + t('notifications') + '</h2><button class="x">✕</button></div><div class="sheet-body"></div>';
  const body = sheet.querySelector('.sheet-body');
  if (!d.notifications.length) body.appendChild(el('div','empty','<div class="big">🔔</div>' + t('noNews')));
  const ICONS = {'task.created':'📋','task.status':'🔄','task.reassigned':'👤','update.new':'💬','schedule.new':'📅','user.created':'👋'};
  d.notifications.forEach(n => {
    const p = n.payload || {}; let txt = '';
    if (n.type === 'task.created') txt = '<b>' + esc(p.by) + '</b>' + t('n_assigned') + esc(p.title);
    else if (n.type === 'task.status') txt = '<b>' + esc(p.by) + '</b>' + t('n_moved') + esc(p.title) + t('n_to') + '<b>' + esc(p.toEs) + '</b>';
    else if (n.type === 'task.reassigned') txt = '<b>' + esc(p.by) + '</b>' + t('n_moved') + esc(p.title) + t('n_to') + esc(p.to);
    else if (n.type === 'update.new') txt = '<b>' + esc(p.by) + '</b>' + t('n_updateIn') + esc(p.title) + '"' + (p.hasPhoto ? ' 📷' : '');
    else if (n.type === 'schedule.new') txt = '<b>' + esc(p.by) + '</b>' + t('n_scheduled') + esc(p.title) + ' (' + fmtDateShort(p.date) + (p.start ? ' ' + p.start : '') + ')';
    else if (n.type === 'user.created') txt = t('n_newAccount') + esc(p.name) + ' (@' + esc(p.username) + ')';
    const row = el('div','notif' + (n.seq > d.lastSeen ? ' unread' : ''),
      '<div class="ni">' + (ICONS[n.type] || '•') + '</div><div class="grow"><div>' + txt + '</div>' +
      '<div class="meta-line">' + fmtTs(n.ts) + '</div></div>');
    if (p.taskId) row.onclick = () => { ov.remove(); openTask(p.taskId); };
    body.appendChild(row);
  });
  sheet.querySelector('.x').onclick = () => { ov.remove(); refreshAll(); };
  ov.onclick = e => { if (e.target === ov) { ov.remove(); refreshAll(); } };
  ov.appendChild(sheet); document.body.appendChild(ov);
  if (d.notifications.length) {
    const maxSeq = Math.max(...d.notifications.map(n => n.seq));
    api('/api/seen', {method:'POST', body:JSON.stringify({seq:maxSeq})}).catch(()=>{});
  }
};

/* ================= FAB ================= */
$('#fab').onclick = () => {
  if (tab === 'tasks') taskForm();
  else if (tab === 'calendar') {
    // quick chooser: task vs event
    const ov = el('div','overlay'); const sheet = el('div','sheet');
    sheet.innerHTML = '<div class="sheet-head"><h2>+</h2><button class="x">✕</button></div><div class="sheet-body"></div>';
    const body = sheet.querySelector('.sheet-body');
    const mk = (label, fn) => {
      const b = el('button','btn btn-ghost', label);
      b.style.cssText = 'width:100%;margin-bottom:10px;padding:14px;font-size:15px';
      b.onclick = () => { ov.remove(); fn(); };
      body.appendChild(b);
    };
    mk('✅ ' + t('newTask'), taskForm);
    mk('🎉 ' + t('newEvent'), milestoneForm);
    sheet.querySelector('.x').onclick = () => ov.remove();
    ov.onclick = e => { if (e.target === ov) ov.remove(); };
    ov.appendChild(sheet); document.body.appendChild(ov);
  }
};
